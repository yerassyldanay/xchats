name: Bug report
description: Something in xchats isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a **security vulnerability**? Please don't file it here — use
        [private reporting](https://github.com/yerassyldanay/xchats/security/advisories/new)
        instead (see [SECURITY.md](../../SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of the Settings page's version display, or `git rev-parse HEAD`.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Docker Compose (make up)
        - From source (make dev-backend / dev-frontend)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Backend/frontend logs, browser console errors — redact anything sensitive first.
      render: shell
