version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  # A separate entry, not folded into the one above: evals/harness is a
  # distinct Go module (its own go.mod, a newer Go toolchain requirement —
  # see .github/workflows/ci.yml's evals-harness job) with its own
  # independent dependency graph (notably pgx, which backend/ doesn't use
  # at all).
  - package-ecosystem: gomod
    directory: /evals/harness
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
