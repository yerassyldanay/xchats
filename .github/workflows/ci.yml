name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      evals: ${{ steps.filter.outputs.evals }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker_backend: ${{ steps.filter.outputs.docker_backend }}
      docker_frontend: ${{ steps.filter.outputs.docker_frontend }}
      links: ${{ steps.filter.outputs.links }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            evals:
              - 'evals/harness/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            docker_backend:
              - 'backend/Dockerfile'
              - 'backend/.dockerignore'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            docker_frontend:
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/nginx.conf'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            links:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  backend-test:
    name: backend-test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      # Pin the toolchain to exactly what backend/go.mod declares — with the
      # default GOTOOLCHAIN=auto, a future go.mod bump would silently
      # download a different compiler mid-CI instead of failing visibly.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          # The Lint step's --new-from-merge-base diff needs the merge-base
          # commit in history — the default depth-1 checkout only has the tip.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # -race -count=1: every DB test gets its own fresh SQLite file under
      # t.TempDir() (see internal/dbtest), so the suite is parallel-safe and
      # needs no external service — nothing here reads an API key or shells
      # out to a live network call.
      #
      # -timeout=30m: go test's own default is 10m PER PACKAGE, not for the
      # whole `./...` run — a single large package (internal/httpapi, which
      # carries the inbox/campaigns/CRM/chat integration suites and spins up
      # a real httptest.Server per test) now legitimately needs more than
      # that under -race, and hits the default alarm even though nothing is
      # hung (see the panic: "test timed out after 10m0s" trace on a plain
      # master run). Bumped from 20m to 30m after PR #98's virtual-fact-
      # columns suite grew internal/httpapi further and a run still hit the
      # wall at 1200.059s — the goroutine dump showed genuinely in-flight
      # net/http and database/sql work, not a stuck/looped deadlock, i.e.
      # the same "package-level go test parallelism under -race contends
      # for CPU/disk across every package's own SQLite DB" pressure the
      # first bump already diagnosed, just now enough to clear 20m too.
      # Measured headroom, still not a guess at a hang.
      - name: Test
        working-directory: backend
        run: go test -race -count=1 -timeout=30m ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Minor-pinned, not `latest`: this is a required check with no
          # admin bypass, so it must not go red just because upstream shipped
          # a release. Bump deliberately (Dependabot won't touch this input).
          version: v2.12
          install-only: true

      # Git-local diff, not the action's `only-new-issues: true`: that mode
      # fetches the diff from the GitHub API and, on any failure, silently
      # lints the whole tree instead — 142 pre-existing findings would go red
      # for reasons unrelated to the PR. `--new-from-merge-base` only looks at
      # history already on disk (fetch-depth: 0 above), so it can only fail
      # for something the PR actually introduced. Config is named explicitly
      # since this job's working-directory isn't the config's directory.
      - name: Lint
        working-directory: backend
        run: |
          golangci-lint run \
            --config="$GITHUB_WORKSPACE/.golangci.yml" \
            --new-from-merge-base=origin/${{ github.base_ref || 'master' }}

  # A separate job, not a step in backend-test: evals/harness/go.mod
  # declares go 1.26.4, newer than backend/go.mod's 1.25.0. Under the
  # default GOTOOLCHAIN=auto a single job could build both by silently
  # downloading 1.26.4 partway through — pinning each job to its own
  # go-version-file (and GOTOOLCHAIN: local) makes the version split
  # explicit instead of invisible.
  #
  # Scope: harness tests are hermetic (no os.Getenv/exec.Command, all HTTP
  # via httptest). `harness run` (promptfoo, real billed OpenRouter calls)
  # is a separate subcommand nothing here invokes.
  evals-harness:
    name: evals-harness
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: evals/harness/go.mod
          cache-dependency-path: evals/harness/go.sum

      - name: Vet
        working-directory: evals/harness
        run: go vet ./...

      - name: Test
        working-directory: evals/harness
        run: go test ./...

  frontend-test:
    name: frontend-test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      # No production domain exists yet. build-blog.ts refuses to *silently*
      # default to the placeholder in CI — so choose it explicitly here. That
      # is the guard working as intended: an explicit decision, not a silent
      # one. When a real domain exists, change it here AND in
      # frontend/Dockerfile + release.yml — published images currently bake
      # this same placeholder in today, with no warning at all (Dockerfile
      # sets neither CI nor SITE_ORIGIN, so the guard never fires there).
      SITE_ORIGIN: https://xchats.example
    steps:
      - uses: actions/checkout@v7

      # .nvmrc drives this job, but frontend/Dockerfile carries its own FROM
      # node:<major> that nothing else checks — so the image that actually
      # ships could build on a different Node than CI ever tested, silently.
      # Dependabot updates the Dockerfile tag and cannot touch .nvmrc, so the
      # drift is not hypothetical: it opened node 22->25 (#39) and 22->26 (#58)
      # against a repo pinned to 22.
      - name: node version pins agree
        run: |
          nvmrc="$(tr -d '[:space:]' < .nvmrc)"
          dockerfile="$(sed -n 's/^FROM node:\([0-9]*\).*/\1/p' frontend/Dockerfile)"
          if [ "$nvmrc" != "$dockerfile" ]; then
            echo "::error::Node major mismatch: .nvmrc=$nvmrc but frontend/Dockerfile=$dockerfile. Update both together."
            exit 1
          fi
          echo "Both pinned to Node $nvmrc."

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx eslint .
        working-directory: frontend

      - run: npm run test:unit
        working-directory: frontend

      # Includes the vue-tsc typecheck plus the blog static-site build — see
      # package.json's build script.
      - run: npm run build
        working-directory: frontend

  docker-build:
    name: docker-build
    needs: changes
    if: needs.changes.outputs.docker_backend == 'true' || needs.changes.outputs.docker_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        if: needs.changes.outputs.docker_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        if: needs.changes.outputs.docker_frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Offline only, deliberately: external sites reorganise for reasons no PR
  # here can fix, and this is a required check with no admin bypass. The
  # scheduled sweep in link-check-external.yml covers the network case
  # separately, without blocking merges — see that file's header comment.
  links:
    name: links
    needs: changes
    if: needs.changes.outputs.links == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: lycheeverse/lychee-action@v2
        with:
          # Minor-pinned for the same reason as golangci-lint above: a
          # required check with no bypass must not go red from an upstream
          # release. Bump deliberately.
          lycheeVersion: v0.24.2
          args: >-
            --offline
            --no-progress
            './**/*.md'
          fail: true
          failIfEmpty: true
          jobSummary: true
