name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    env:
      # Pin the toolchain to exactly what backend/go.mod declares — with the
      # default GOTOOLCHAIN=auto, a future go.mod bump would silently
      # download a different compiler mid-CI instead of failing visibly.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          # The Lint step's --new-from-merge-base diff needs the merge-base
          # commit in history — the default depth-1 checkout only has the tip.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # -race -count=1: every DB test gets its own fresh SQLite file under
      # t.TempDir() (see internal/dbtest), so the suite is parallel-safe and
      # needs no external service — nothing here reads an API key or shells
      # out to a live network call.
      - name: Test
        working-directory: backend
        run: go test -race -count=1 ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Minor-pinned, not `latest`: this is a required check with no
          # admin bypass, so it must not go red just because upstream shipped
          # a release. Bump deliberately (Dependabot won't touch this input).
          version: v2.12
          install-only: true

      # Git-local diff, not the action's `only-new-issues: true`: that mode
      # fetches the diff from the GitHub API and, on any failure, silently
      # lints the whole tree instead — 142 pre-existing findings would go red
      # for reasons unrelated to the PR. `--new-from-merge-base` only looks at
      # history already on disk (fetch-depth: 0 above), so it can only fail
      # for something the PR actually introduced. Config is named explicitly
      # since this job's working-directory isn't the config's directory.
      - name: Lint
        working-directory: backend
        run: |
          golangci-lint run \
            --config="$GITHUB_WORKSPACE/.golangci.yml" \
            --new-from-merge-base=origin/${{ github.base_ref || 'master' }}

  # A separate job, not a step in backend-test: evals/harness/go.mod
  # declares go 1.26.4, newer than backend/go.mod's 1.25.0. Under the
  # default GOTOOLCHAIN=auto a single job could build both by silently
  # downloading 1.26.4 partway through — pinning each job to its own
  # go-version-file (and GOTOOLCHAIN: local) makes the version split
  # explicit instead of invisible.
  #
  # Scope: harness tests are hermetic (no os.Getenv/exec.Command, all HTTP
  # via httptest). `harness run` (promptfoo, real billed OpenRouter calls)
  # is a separate subcommand nothing here invokes.
  evals-harness:
    name: evals-harness
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: evals/harness/go.mod
          cache-dependency-path: evals/harness/go.sum

      - name: Build
        working-directory: evals/harness
        run: go build ./...

      - name: Vet
        working-directory: evals/harness
        run: go vet ./...

      - name: Test
        working-directory: evals/harness
        run: go test ./...

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    env:
      # No production domain exists yet. build-blog.ts refuses to *silently*
      # default to the placeholder in CI — so choose it explicitly here. That
      # is the guard working as intended: an explicit decision, not a silent
      # one. When a real domain exists, change it here AND in
      # frontend/Dockerfile + release.yml — published images currently bake
      # this same placeholder in today, with no warning at all (Dockerfile
      # sets neither CI nor SITE_ORIGIN, so the guard never fires there).
      SITE_ORIGIN: https://xchats.example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npx eslint .
        working-directory: frontend

      - run: npm run test:unit
        working-directory: frontend

      # Includes the vue-tsc typecheck again (cheap, already-warm) plus the
      # blog static-site build — see package.json's build script.
      - run: npm run build
        working-directory: frontend

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Offline only, deliberately: external sites reorganise for reasons no PR
  # here can fix, and this is a required check with no admin bypass. The
  # scheduled sweep in link-check-external.yml covers the network case
  # separately, without blocking merges — see that file's header comment.
  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          # Minor-pinned for the same reason as golangci-lint above: a
          # required check with no bypass must not go red from an upstream
          # release. Bump deliberately.
          lycheeVersion: v0.24.2
          args: >-
            --offline
            --no-progress
            './**/*.md'
          fail: true
          failIfEmpty: true
          jobSummary: true
