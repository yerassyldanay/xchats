name: Link check (external)

# Not a required status check (see ci.yml's `links` job, which is the
# offline, PR-blocking gate). This one actually hits the network: external
# sites reorganise for reasons no single PR can fix, so failures here file a
# rolling issue instead of failing anyone's merge. Runs weekly rather than
# per-PR, plus workflow_dispatch so it can be forced — scheduled workflows
# are disabled after 60 days of repo inactivity.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check-external:
    name: link-check-external
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --scheme https --scheme http
            --exclude-all-private
            --max-retries 4
            --exclude-path 'THIRD_PARTY_NOTICES\.md$'
            --no-progress
            --format markdown
            './**/*.md'
          fail: false
          jobSummary: true
          output: ./lychee/out.md

      # THIRD_PARTY_NOTICES.md is excluded here, not fixed: its ~110 URLs are
      # generated by `make notices` (go-licenses), whose blob/<version>/<path>
      # scheme is wrong for Go submodule tags and pseudo-versions. Regenerated
      # wrong every run — tracked separately, not something a link sweep
      # should keep re-reporting.
      - name: Find existing link-rot issue
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --label link-rot --state open --json number --jq '.[0].number // empty')
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: File or update link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link rot report
          content-filepath: ./lychee/out.md
          labels: link-rot
          issue-number: ${{ steps.find-issue.outputs.number }}
