name: Release

# Tag-triggered release pipeline orchestrating container images, native desktop
# executables, and the AGPL-3.0 corresponding-source bundle.
#
# Because GitHub's "Immutable Releases" policy is enabled on this repository,
# releases cannot have assets uploaded, updated, or deleted once published.
# Therefore, all parallel build jobs upload their output as workflow artifacts,
# and a final publish-release job gathers and verifies all 8 release assets,
# attaches them to a draft release, and publishes it only after the draft has
# been checked. This draft gate applies to GitHub Release assets; GHCR image
# publication is an independently retriable part of the pipeline.
#
# Staged deliberately: this covers build + publish + SLSA provenance attestation.
# cosign image signing and a full SBOM are tracked as v1.1 (see docs/release/signing.md
# and docs/release/sbom-checksums-provenance.md).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to release (for example, v1.0.1)"
        required: true
        type: string

# A draft is mutable, so overlapping attempts for one tag must never inspect,
# upload to, or publish the same draft concurrently. Queue a second attempt;
# it will verify the completed release and exit successfully if the first won.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolve tag pushes and manual dispatches into one validated, immutable build
  # input. All build jobs check out this exact commit rather than the branch from
  # which a manual workflow dispatch happened to be started.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease suffix; got: $REQUESTED_TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
            echo "Release tag does not exist in the checked-out repository: $REQUESTED_TAG" >&2
            exit 1
          fi

          RELEASE_SHA=$(git rev-list -n 1 "$REQUESTED_TAG")
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Preparing $REQUESTED_TAG at $RELEASE_SHA"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to ghcr.io
      id-token: write # required by actions/attest-build-provenance
      attestations: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.release_tag }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # internal/version.Version — see backend/Dockerfile's own comment;
          # the frontend image doesn't read this build-arg (no ARG VERSION
          # in frontend/Dockerfile), so it's a harmless no-op there.
          build-args: |
            VERSION=${{ needs.prepare.outputs.release_tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # SLSA build provenance — free, no external service, unlike cosign
      # signing (deferred to v1.1, see this file's header comment).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Reusable workflow call to compile native desktop binaries for Linux, macOS,
  # and Windows. Each platform produces an archive and .sha256 checksum artifact.
  desktop-build:
    needs: prepare
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ needs.prepare.outputs.release_tag }}
      source_ref: ${{ needs.prepare.outputs.release_sha }}

  # AGPL-3.0/GPL-3.0 sec 6 — every release that publishes binaries/images also
  # publishes complete corresponding source: the repo at this tag plus the
  # source of every Go module statically linked into the backend binary
  # (go.mau.fi/libsignal is GPL-3.0-only; whatsmeow + go.mau.fi/util are
  # MPL-2.0). The npm side needs no vendoring: all frontend deps are
  # permissive and exactly pinned by frontend/package-lock.json, which is in
  # the tarball. evals/harness is a separate Go module that is never built
  # into an image (see backend/Dockerfile — it COPYs only backend/) — its
  # source rides along in the tarball, but its own dependency graph is
  # deliberately not vendored.
  source-bundle:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Same pin rationale as ci.yml — vendor with exactly backend/go.mod's
      # toolchain instead of silently downloading a newer one.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # vendor/ carries every transitively imported package across all
      # GOOS/GOARCH (go mod vendor loads with all build tags) plus each
      # module's LICENSE/NOTICE/PATENTS/COPYING files — with it present,
      # `go build -mod=vendor ./cmd/xchats` rebuilds the shipped binary
      # fully offline.
      - name: Vendor Go dependency source
        working-directory: backend
        run: |
          go mod verify
          go mod vendor

      - name: Build corresponding-source tarball
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          OUT="$RUNNER_TEMP/xchats-${TAG}-corresponding-source.tar.gz"
          # Deterministic archive: stable order, neutral ownership, mtimes
          # pinned to the tag's commit date, gzip without embedded timestamp
          # — regenerating from the same tag is byte-identical. Output goes
          # to RUNNER_TEMP so tar never tries to archive its own output.
          # --exclude='./.git' rather than --exclude-vcs: the latter also
          # strips .gitignore/.gitattributes, which are part of the source.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="$(git log -1 --format=%cI)" \
              --exclude='./.git' \
              --transform "s|^\./|xchats-${TAG}/|" \
              -cf - . | gzip -n -9 > "$OUT"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$OUT")" > "${OUT}.sha256")
          ls -l "$OUT" "${OUT}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: source-bundle
          path: |
            ${{ runner.temp }}/xchats-*-corresponding-source.tar.gz*
          if-no-files-found: error

  # Gathers all built assets from the parallel jobs (3 desktop archives + 3 sha256,
  # 1 source bundle + 1 sha256 = 8 files total), verifies the local files and
  # checksums, uploads them to a draft, verifies the remote draft's exact asset
  # set, and only then publishes it under GitHub's Immutable Releases policy.
  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push, desktop-build, source-bundle]
    permissions:
      contents: write # create Release, upload assets, and publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      # Download only release assets. docker/build-push-action may also attach
      # .dockerbuild records to this run; those are useful diagnostics but are
      # not GitHub Release assets.
      - uses: actions/download-artifact@v8
        with:
          pattern: xchats-desktop-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: source-bundle
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          ls -la artifacts

          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "Tag $TAG no longer resolves to the commit validated by the prepare job." >&2
            exit 1
          fi

          expected_assets=(
            "xchats-desktop-linux-amd64.tar.gz"
            "xchats-desktop-linux-amd64.tar.gz.sha256"
            "xchats-desktop-macos-universal.zip"
            "xchats-desktop-macos-universal.zip.sha256"
            "xchats-desktop-windows-amd64.zip"
            "xchats-desktop-windows-amd64.zip.sha256"
            "xchats-${TAG}-corresponding-source.tar.gz"
            "xchats-${TAG}-corresponding-source.tar.gz.sha256"
          )
          EXPECTED_LIST="$RUNNER_TEMP/expected-assets.txt"
          ACTUAL_LIST="$RUNNER_TEMP/actual-assets.txt"
          REMOTE_LIST="$RUNNER_TEMP/remote-assets.txt"
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          RELEASE_ERROR="$RUNNER_TEMP/release-error.txt"
          printf '%s\n' "${expected_assets[@]}" | sort > "$EXPECTED_LIST"

          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort > "$ACTUAL_LIST"
          if ! diff -u "$EXPECTED_LIST" "$ACTUAL_LIST"; then
            echo "Refusing to publish: local release assets do not match the required 8-file contract." >&2
            exit 1
          fi
          for asset in "${expected_assets[@]}"; do
            if [ ! -s "artifacts/$asset" ]; then
              echo "Refusing to publish an empty asset: $asset" >&2
              exit 1
            fi
          done
          (cd artifacts && sha256sum --strict -c ./*.sha256)

          # Query the release API without turning authorization or server errors
          # into a false "not found" result.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON" 2> "$RELEASE_ERROR"; then
            IS_DRAFT=$(jq -r '.draft' "$RELEASE_JSON")
            if [ "$IS_DRAFT" = "false" ]; then
              jq -r '.assets[].name' "$RELEASE_JSON" | sort > "$REMOTE_LIST"
              if ! diff -u "$EXPECTED_LIST" "$REMOTE_LIST"; then
                echo "Release $TAG is already published but does not contain the exact expected asset set." >&2
                echo "The immutable release cannot be repaired; publish a new version tag." >&2
                exit 1
              fi
              if [ "$(jq -r '.immutable' "$RELEASE_JSON")" != "true" ]; then
                echo "Release $TAG exists with the expected assets but is not immutable." >&2
                exit 1
              fi
              echo "Release $TAG is already published, immutable, and complete."
              exit 0
            fi
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Unexpected release state for $TAG." >&2
              exit 1
            fi
            echo "Reusing existing draft release for $TAG."
          else
            if ! grep -q 'HTTP 404' "$RELEASE_ERROR"; then
              cat "$RELEASE_ERROR" >&2
              exit 1
            fi
            echo "Creating draft release for $TAG..."
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

          # Drafts remain mutable. A failed upload leaves a recoverable draft;
          # the queued retry replaces only the eight workflow-owned assets.
          echo "Uploading release assets to the draft..."
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" artifacts/*

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON"
          if [ "$(jq -r '.draft' "$RELEASE_JSON")" != "true" ]; then
            echo "Release $TAG stopped being a draft before verification." >&2
            exit 1
          fi
          jq -r '.assets[].name' "$RELEASE_JSON" | sort > "$REMOTE_LIST"
          if ! diff -u "$EXPECTED_LIST" "$REMOTE_LIST"; then
            echo "Refusing to publish: the draft does not contain the exact expected asset set." >&2
            exit 1
          fi

          echo "Publishing release for $TAG..."
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON"
          if [ "$(jq -r '.draft' "$RELEASE_JSON")" != "false" ] || \
             [ "$(jq -r '.immutable' "$RELEASE_JSON")" != "true" ]; then
            echo "Release $TAG was published but GitHub did not report it as immutable." >&2
            exit 1
          fi
          echo "Release $TAG is published, immutable, and complete."
