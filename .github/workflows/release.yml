name: Release

# Tag-triggered release pipeline orchestrating container images, native desktop
# executables, and the AGPL-3.0 corresponding-source bundle.
#
# Because GitHub's "Immutable Releases" policy is enabled on this repository,
# releases cannot have assets uploaded, updated, or deleted once published.
# Therefore, all parallel build jobs upload their output as workflow artifacts,
# and a final publish-release job gathers all 8 release assets, creates a draft
# release, attaches all assets atomically, and publishes it with --draft=false.
#
# Staged deliberately: this covers build + publish + SLSA provenance attestation.
# cosign image signing and a full SBOM are tracked as v1.1 (see docs/release/signing.md
# and docs/release/sbom-checksums-provenance.md).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to ghcr.io
      id-token: write # required by actions/attest-build-provenance
      attestations: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # internal/version.Version — see backend/Dockerfile's own comment;
          # the frontend image doesn't read this build-arg (no ARG VERSION
          # in frontend/Dockerfile), so it's a harmless no-op there.
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # SLSA build provenance — free, no external service, unlike cosign
      # signing (deferred to v1.1, see this file's header comment).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Reusable workflow call to compile native desktop binaries for Linux, macOS,
  # and Windows. Each platform produces an archive and .sha256 checksum artifact.
  desktop-build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  # AGPL-3.0/GPL-3.0 sec 6 — every release that publishes binaries/images also
  # publishes complete corresponding source: the repo at this tag plus the
  # source of every Go module statically linked into the backend binary
  # (go.mau.fi/libsignal is GPL-3.0-only; whatsmeow + go.mau.fi/util are
  # MPL-2.0). The npm side needs no vendoring: all frontend deps are
  # permissive and exactly pinned by frontend/package-lock.json, which is in
  # the tarball. evals/harness is a separate Go module that is never built
  # into an image (see backend/Dockerfile — it COPYs only backend/) — its
  # source rides along in the tarball, but its own dependency graph is
  # deliberately not vendored.
  source-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Same pin rationale as ci.yml — vendor with exactly backend/go.mod's
      # toolchain instead of silently downloading a newer one.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # vendor/ carries every transitively imported package across all
      # GOOS/GOARCH (go mod vendor loads with all build tags) plus each
      # module's LICENSE/NOTICE/PATENTS/COPYING files — with it present,
      # `go build -mod=vendor ./cmd/xchats` rebuilds the shipped binary
      # fully offline.
      - name: Vendor Go dependency source
        working-directory: backend
        run: |
          go mod verify
          go mod vendor

      - name: Build corresponding-source tarball
        run: |
          TAG='${{ github.ref_name }}'
          OUT="$RUNNER_TEMP/xchats-${TAG}-corresponding-source.tar.gz"
          # Deterministic archive: stable order, neutral ownership, mtimes
          # pinned to the tag's commit date, gzip without embedded timestamp
          # — regenerating from the same tag is byte-identical. Output goes
          # to RUNNER_TEMP so tar never tries to archive its own output.
          # --exclude='./.git' rather than --exclude-vcs: the latter also
          # strips .gitignore/.gitattributes, which are part of the source.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="$(git log -1 --format=%cI)" \
              --exclude='./.git' \
              --transform "s|^\./|xchats-${TAG}/|" \
              -cf - . | gzip -n -9 > "$OUT"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$OUT")" > "${OUT}.sha256")
          ls -l "$OUT" "${OUT}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: source-bundle
          path: |
            ${{ runner.temp }}/xchats-*-corresponding-source.tar.gz*
          if-no-files-found: error

  # Gathers all built assets from the parallel jobs (3 desktop archives + 3 sha256,
  # 1 source bundle + 1 sha256 = 8 files total), creates a draft GitHub Release,
  # attaches all assets, and publishes the release atomically to satisfy GitHub's
  # Immutable Releases policy.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-and-push, desktop-build, source-bundle]
    permissions:
      contents: write # create Release, upload assets, and publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ github.ref_name }}'
          ls -la artifacts

          # Check existing release state for idempotency / safe re-runs.
          # Under Immutable Releases, published releases cannot be modified.
          # Leftover draft releases from an interrupted attempt can and must be deleted
          # so we can re-create cleanly.
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo "not_found")
          if [ "$IS_DRAFT" = "false" ]; then
            echo "Release $TAG is already published and immutable — nothing to do."
            exit 0
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "Found leftover draft release for $TAG from a previous attempt. Deleting draft before re-creating..."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          # Step 1: Create draft release and upload all 8 assets
          echo "Creating draft release for $TAG and uploading assets..."
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/*

          # Step 2: Publish release (locks release permanently under Immutable Releases policy)
          echo "Publishing release for $TAG..."
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
