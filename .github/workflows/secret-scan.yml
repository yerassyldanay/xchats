name: Secret scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans commit history, not just the working tree — a
          # shallow checkout would only ever see the merge commit.
          fetch-depth: 0

      # v3, not v2: v2 is a Node 20 action, and GitHub already defaults
      # runners to Node 24 (removing Node 20 outright on 2026-09-16) — v2
      # would go from warning to hard-broken on its own, with no PR to blame.
      # v3 is a same-behavior runtime migration, nothing else changes.
      - uses: gitleaks/gitleaks-action@v3
        env:
          # No paid GitHub Advanced Security license assumed — the action's
          # own license-gated reporting features are skipped automatically
          # when this is unset; the scan itself still runs and still fails
          # the job on a finding.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # Required to scan pull_request events at all (gitleaks-action
          # calls the GitHub API to resolve the PR diff) — push-triggered
          # runs on master never exercised this path, which is why it was
          # never caught before this was opened as a PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
