version: "2"

# Keep this file at the repo root — do not move it into backend/. CI (see
# .github/workflows/ci.yml's backend-test job) runs golangci-lint from
# backend/ but points --config at this root file explicitly. With
# run.relative-path-mode defaulting to "cfg", issue paths come out relative
# to *this file's* directory (e.g. backend/internal/x.go), matching the
# shape `git diff --new-from-merge-base` reports. Moving this file into
# backend/ would make issue paths relative to backend/ instead
# (internal/x.go) — silently breaking the diff match and turning the
# new-code-only gate into a no-op that always passes.

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell

  settings:
    gosec:
      # G104 (unchecked error) overlaps errcheck above; excluded to avoid
      # double-reporting the same finding under two different linters.
      # G101 (potential hardcoded credentials) is a bare string-pattern
      # match on identifier/literal names — it fires on things like a
      # constant NAMED "...Secret" or a test password literal, not on
      # anything it actually inspected the value of. Real secrets-in-git
      # detection is gitleaks' job (secret-scan.yml), which reads content,
      # not names.
      excludes:
        - G104
        - G101
    errcheck:
      # Unchecked Close()/io.Copy(io.Discard, ...) on an httptest response
      # body in test cleanup is a standard, low-risk Go convention (the
      # process is about to tear the test down regardless) — excluded only
      # for _test.go files, not production code.
      exclude-functions:
        - (*net/http.Response).Body.Close

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
