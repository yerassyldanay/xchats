<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xchats — База знаний</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280; --border: #e5e7eb;
    --accent: #2563eb; --accent-text: #ffffff; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
    --chip-bg: #eef2ff; --code-bg: #f1f5f9;
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --card: #22252a; --text: #e7e9ec; --muted: #9aa1ad; --border: #33373d;
    --accent: #3b82f6; --accent-text: #ffffff; --danger: #f87171; --ok: #4ade80; --warn: #fbbf24;
    --chip-bg: #1e2a4a; --code-bg: #1c1f24;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --card: #22252a; --text: #e7e9ec; --muted: #9aa1ad; --border: #33373d;
      --accent: #3b82f6; --accent-text: #ffffff; --danger: #f87171; --ok: #4ade80; --warn: #fbbf24;
      --chip-bg: #1e2a4a; --code-bg: #1c1f24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.45;
    overflow-x: hidden;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  a { color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 500;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-sm { padding: 4px 9px; font-size: 12px; }

  header.topbar {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--card); flex-wrap: wrap;
  }
  header.topbar h1 { font-size: 15px; margin: 0; font-weight: 700; white-space: nowrap; }
  header.topbar .sub { font-size: 11px; color: var(--muted); }
  header.topbar .spacer { flex: 1; }

  nav.tabs { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--card); flex-wrap: wrap; }
  nav.tabs button {
    border: none; background: transparent; color: var(--muted); padding: 8px 12px;
    font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; border-radius: 0;
  }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs { border-bottom: 1px solid var(--border); }

  main { flex: 1; padding: 14px 16px 32px; max-width: 900px; width: 100%; margin: 0 auto; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600;
  }
  .chip.active { background: var(--chip-bg); color: var(--accent); border-color: var(--accent); }
  input[type="search"], input[type="text"], select, textarea {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .row-card { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .row-card:hover { border-color: var(--accent); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row-sub code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; }

  .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; }
  .badge-published { background: #dcfce7; color: #166534; }
  .badge-new { background: #dbeafe; color: #1e40af; }
  .badge-changed { background: #fef9c3; color: #854d0e; }
  .badge-to_delete { background: #fee2e2; color: #991b1b; }
  .badge-live { background: var(--chip-bg); color: var(--accent); }
  .badge-draft { background: #fef3c7; color: #92400e; }
  :root[data-theme="dark"] .badge-published { background: #14351f; color: #86efac; }
  :root[data-theme="dark"] .badge-new { background: #1e2f4d; color: #93c5fd; }
  :root[data-theme="dark"] .badge-changed { background: #3f3313; color: #fde047; }
  :root[data-theme="dark"] .badge-to_delete { background: #451a1a; color: #fca5a5; }
  :root[data-theme="dark"] .badge-draft { background: #3f3313; color: #fde047; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .badge-published { background: #14351f; color: #86efac; }
    :root:not([data-theme="light"]) .badge-new { background: #1e2f4d; color: #93c5fd; }
    :root:not([data-theme="light"]) .badge-changed { background: #3f3313; color: #fde047; }
    :root:not([data-theme="light"]) .badge-to_delete { background: #451a1a; color: #fca5a5; }
    :root:not([data-theme="light"]) .badge-draft { background: #3f3313; color: #fde047; }
  }

  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .error-box { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  :root[data-theme="dark"] .error-box { background: #451a1a; color: #fca5a5; }
  .loading { color: var(--muted); padding: 24px; text-align: center; }

  .publish-banner {
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    background: var(--chip-bg); border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px;
  }
  .publish-banner p { margin: 0; font-size: 13px; }

  .field-row { display: flex; padding: 7px 0; border-bottom: 1px solid var(--border); gap: 14px; }
  .field-row:last-child { border-bottom: none; }
  .field-label { width: 40%; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .field-value { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .field-value.empty-val { color: var(--muted); font-style: italic; }
  .media-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--code-bg);
    border-radius: 6px; padding: 3px 8px; font-size: 11px; font-family: ui-monospace, monospace;
  }

  .source-block { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .source-block h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

  /* Per-field media editor. No player CSS: only images render inline — video,
     audio and documents are icon + name + link, so nothing but an image is
     ever fetched without the user clicking. */
  .media-field { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .media-field:last-child { border-bottom: none; }
  .media-field.drag { background: var(--chip-bg); border-radius: 8px; }
  .media-field input[type=file] { margin: 6px 0 2px; font-size: 12px; max-width: 100%; }
  .media-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
  .media-open { display: inline-flex; line-height: 0; }
  .media-thumb {
    width: 84px; height: 84px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--border); background: var(--chip-bg);
  }
  .media-thumb.media-broken { object-fit: contain; padding: 6px; }
  .media-doc {
    display: inline-flex; align-items: center; gap: 6px; background: var(--code-bg);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; max-width: 100%;
    text-decoration: none; color: var(--text);
  }
  .media-doc:hover { color: var(--accent); }
  .upload-item { margin-top: 8px; padding: 6px 8px; background: var(--chip-bg); border-radius: 8px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .progress-bar > div { height: 100%; background: var(--accent); transition: width .2s; }

  .back-link { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--muted); background: none; border: none; padding: 0; }
  .back-link:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Constants mirroring the server's fixed vocabulary (plan/mcp.md §2, §5).
  // Kept in sync with backend/internal/kbstore/mcp_types.go and
  // internal/mcpserver/handlers.go's per-type field lists — this widget has
  // no way to introspect tool schemas through every host bridge, so these
  // stay hand-maintained rather than fetched. The one exception is the media
  // attachment matrix (which type has which field, of which kind, singular
  // or plural) — that used to be hand-maintained here too (a THIRD copy,
  // alongside kbstore.mediaColumnKind and kb_info's flat field list), until
  // it drifted enough from the server's real schemas to offer fields a type
  // does not have. It is now fetched from kb_info.media_attachment_fields at
  // boot (state.mediaAttachmentFields) and driven entirely from there — see
  // mediaFieldsFor/renderMediaSection below.
  // ---------------------------------------------------------------------
  var ALL_TYPES = ["assistant", "topic", "product", "tariff", "contacts", "policies", "delivery_zone"];
  var TYPE_META = {
    assistant:     { keyParam: null,   label: "Ассистент" },
    topic:         { keyParam: "slug", label: "Тема" },
    product:       { keyParam: "ref",  label: "Товар" },
    tariff:        { keyParam: "ref",  label: "Тариф" },
    contacts:      { keyParam: null,   label: "Контакты" },
    policies:      { keyParam: null,   label: "Политики" },
    delivery_zone: { keyParam: "ref",  label: "Зона доставки" },
  };
  // Mirrors mcpserver.MaxMediaUploadBytes (media_upload.go) — a client-side
  // check purely for fast, clear UX; the server enforces this independently
  // and is the actual boundary.
  var MAX_UPLOAD_BYTES = 50 * 1024 * 1024;
  var FIELD_LABELS = {
    title: "Заголовок", body_md: "Текст", name: "Название", price: "Цена", description: "Описание",
    category: "Категория", in_stock: "В наличии", sales_status: "Статус продаж",
    limit_text: "Лимит", fee: "Комиссия", summary: "Кратко", pricing_type: "Тип тарификации",
    advantages: "Преимущества", disadvantages: "Недостатки",
    whatsapp: "WhatsApp", email: "Email", address: "Адрес", legal_information: "Юр. информация",
    callback_time: "Время звонка", working_hours: "Часы работы", phone: "Телефон", website: "Сайт", instagram: "Instagram",
    delivery_cost: "Стоимость доставки", delivery_in_days: "Срок доставки, дн.",
    free_delivery_from: "Бесплатно от", min_order: "Мин. заказ", prepayment: "Предоплата",
    installment: "Рассрочка", return_period_in_days: "Возврат, дн.", warranty: "Гарантия",
    outside_zones_note: "Вне зон доставки", zone_level: "Уровень зоны", parent_ref: "Родительская зона",
    notes: "Заметки", delivery_available: "Доставка доступна",
    persona: "Персона", mission: "Миссия", guardrails: "Ограничения", language_policy: "Язык ответов",
    reply_max_words: "Макс. слов в ответе", ref: "Ref", slug: "Slug", updated_at: "Обновлено",
  };
  var STATE_LABELS = { published: "Опубликовано", new: "Новое", changed: "Изменено", to_delete: "На удаление" };

  // ---------------------------------------------------------------------
  // Application state (a single mutable object; render() redraws #app from
  // it — no framework, this is a small enough surface that plain DOM string
  // building is clearer than pulling one in).
  // ---------------------------------------------------------------------
  var state = {
    bridgeKind: null,     // "openai" | "postmessage" | "none" | null (not yet determined)
    connecting: true,
    view: "all",          // "all" | "live" | "draft" | "record"
    typeFilter: null,
    query: "",
    items: [],
    draftVersion: null,
    frontendBaseUrl: "",
    reviewUrl: null,       // one-time, organization-bound handoff URL from
                           // the most recent tool result's _meta (Task 15);
                           // preferred over frontendBaseUrl's bare /playground
                           // link whenever a tool call has actually supplied one.
    mediaFieldKinds: {},
    mediaAttachmentFields: {}, // { [type]: [{field, kind, multiple}, ...] } from kb_info
    mediaIndex: {},        // { [material_id]: {id,filename,mime_type,size_bytes,kind,status,url} }
                           // from kb_read's _meta["xchats/media"] — see unwrapToolResult.
    record: null,          // { type, key, entries: [{type,source,data}, ...] }
    recordBack: "all",
    loading: false,
    error: null,
    pendingOpen: null,
    // Two-step delete. null until the Удалить button arms it; {type,key} while
    // an inline confirmation is showing. window.confirm is unusable here: MCP
    // hosts embed this widget in a SANDBOXED iframe, where the browser blocks
    // modal dialogs and confirm() returns false without ever showing anything —
    // which is precisely why the delete button did nothing at all.
    confirmDelete: null,
    deleting: false,       // a kb_delete is in flight; disables the confirm button
    uploads: {},           // { [field]: [uploadItem, ...] } — see the upload queue
    uploadNotes: {},       // { [field]: string } — per-field advisory notes
    uploadSeq: 0,
  };

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function humanize(key) {
    if (FIELD_LABELS[key]) return FIELD_LABELS[key];
    return key.replace(/_/g, " ").replace(/^./, function (c) { return c.toUpperCase(); });
  }
  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject(new Error("timeout")); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  // ---------------------------------------------------------------------
  // Host bridge. Wire-format caveat (see internal/mcpserver/resources.go):
  // ChatGPT's Apps SDK (window.openai.callTool) is the concretely documented
  // path; anything else gets a best-effort generic postMessage JSON-RPC
  // envelope, downgrading to a disconnected state if neither ever answers.
  // ---------------------------------------------------------------------
  var rpcSeq = 0;
  var pendingRpc = {};
  // Tools whose result changes what a fresh kb_summary/kb_read would show —
  // used only to decide whether an incoming tool-result notification (below)
  // should trigger a refresh.
  var MUTATING_TOOLS = [
    "kb_assistant_upsert", "kb_topic_upsert", "kb_product_upsert", "kb_tariff_upsert",
    "kb_contacts_upsert", "kb_policies_upsert", "kb_delivery_zone_upsert", "kb_delete",
  ];
  window.addEventListener("message", function (ev) {
    // Ignore anything not from our actual host frame — without this check any
    // OTHER embedded frame (or a malicious top-level page this widget was
    // never meant to run under) could inject fake tool responses.
    if (ev.source !== window.parent) return;
    var data = ev.data;
    if (!data || typeof data !== "object") return;
    if (data.id !== undefined && pendingRpc[data.id]) {
      var p = pendingRpc[data.id];
      delete pendingRpc[data.id];
      if (data.error) p.reject(new Error(data.error.message || "tool call failed"));
      else p.resolve(data.result);
      return;
    }
    // Best-effort standard tool-result notification for a tool call the
    // MODEL made directly (not through this widget's own callTool) — refresh
    // so the widget doesn't keep showing data a concurrent model-driven write
    // just changed. This wire format is not yet stable across hosts (see
    // this file's own top-of-file caveat); recognized defensively, never
    // required for the widget's own core flows to work.
    if (data.method === "notifications/tools/result" && data.params &&
        MUTATING_TOOLS.indexOf(data.params.name) !== -1 && state.bridgeKind) {
      // Never reload out from under an upload in flight — a model-driven write
      // arriving mid-batch would otherwise discard the queue and the user's
      // remaining files with it.
      if (!hasActiveUploads()) loadForView(state.view);
    }
  });
  function callToolViaPostMessage(name, args) {
    return new Promise(function (resolve, reject) {
      var id = "kbw-" + (++rpcSeq) + "-" + Date.now();
      pendingRpc[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ jsonrpc: "2.0", id: id, method: "tools/call", params: { name: name, arguments: args } }, "*");
      setTimeout(function () {
        if (pendingRpc[id]) { delete pendingRpc[id]; reject(new Error("timed out waiting for host response")); }
      }, 15000);
    });
  }
  function unwrapToolResult(result) {
    if (result && typeof result === "object") {
      if (result.isError) {
        var text = Array.isArray(result.content) && result.content[0] && result.content[0].text;
        throw new Error(text || "tool call failed");
      }
      // Every successful tool result carries a FRESH one-time review-handoff
      // URL when the backend has one configured (mcpserver.Deps.SignReviewHandoff
      // is non-nil) — captured here, the one choke point every callTool() result
      // passes through, so no individual call site needs to know about it.
      if (result._meta && typeof result._meta === "object" && result._meta["xchats/reviewUrl"]) {
        state.reviewUrl = result._meta["xchats/reviewUrl"];
      }
      // kb_read carries per-material preview metadata (filename, mime, size,
      // kind and a short-lived signed URL) in _meta rather than in
      // structuredContent, because kb_read's declared outputSchema is
      // additionalProperties:false and a host validating against its CACHED
      // copy would start rejecting kb_read itself. Captured at the same choke
      // point as reviewUrl. Absent _meta simply means no previews.
      if (result._meta && typeof result._meta === "object" && result._meta["xchats/media"]) {
        var idx = result._meta["xchats/media"];
        if (idx && typeof idx === "object") {
          Object.keys(idx).forEach(function (id) { state.mediaIndex[id] = idx[id]; });
        }
      }
      if ("structuredContent" in result) return result.structuredContent;
    }
    return result;
  }
  function callTool(name, args) {
    if (state.bridgeKind === "openai") {
      return window.openai.callTool(name, args).then(unwrapToolResult);
    }
    if (state.bridgeKind === "postmessage") {
      return callToolViaPostMessage(name, args).then(unwrapToolResult);
    }
    return Promise.reject(new Error("no host bridge available"));
  }
  function applyTheme() {
    var t = window.openai && window.openai.theme;
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  }
  window.addEventListener("openai:set_globals", applyTheme);

  function seedFromInitialOutput() {
    var out = window.openai && window.openai.toolOutput;
    if (!out || typeof out !== "object") return;
    if (out.type && out.key && "draft_version" in out) {
      state.pendingOpen = { type: out.type, key: out.key };
    }
  }

  // sendUiInitialize best-effort-announces this widget to a generic
  // postMessage host per the standard MCP Apps handshake (plan Task 9) —
  // window.openai's Apps SDK bridge has no documented equivalent call, so
  // this is only sent on the generic fallback path. Never awaited: a host
  // that doesn't recognize the method simply never replies, and every real
  // capability this widget needs still comes from kb_info/callTool.
  function sendUiInitialize() {
    if (state.bridgeKind !== "postmessage") return;
    try {
      window.parent.postMessage({ jsonrpc: "2.0", method: "ui/initialize", params: { protocolVersion: "2025-11-25" } }, "*");
    } catch (e) { /* best-effort */ }
  }

  function connect() {
    if (window.openai && typeof window.openai.callTool === "function") {
      state.bridgeKind = "openai";
    } else if (window.parent && window.parent !== window) {
      state.bridgeKind = "postmessage";
    } else {
      state.bridgeKind = "none";
      return Promise.resolve(null);
    }
    sendUiInitialize();
    return withTimeout(callTool("kb_info", {}), 4000).catch(function () {
      state.bridgeKind = "none";
      return null;
    });
  }

  // registerGlobalKeys installs the ONE document-level keyboard listener, at
  // startup — never in wireEvents(), which runs after every render(): a
  // document listener survives the innerHTML rebuild that discards per-element
  // ones, so registering it there would stack a fresh duplicate per render.
  function registerGlobalKeys() {
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Escape") return;
      if (!state.confirmDelete || state.deleting) return;
      state.confirmDelete = null;
      render();
    });
  }

  async function boot() {
    applyTheme();
    registerGlobalKeys();
    seedFromInitialOutput();
    render();
    var info = await connect();
    state.connecting = false;
    if (info) {
      state.frontendBaseUrl = info.frontend_base_url || "";
      state.mediaFieldKinds = info.media_field_kinds || {};
      state.mediaAttachmentFields = info.media_attachment_fields || {};
    }
    if (state.bridgeKind === "none") { render(); return; }
    if (state.pendingOpen) {
      var p = state.pendingOpen; state.pendingOpen = null;
      await openRecord(p.type, p.key, "all");
      return;
    }
    await loadForView(state.view);
  }

  // ---------------------------------------------------------------------
  // Data loading
  // ---------------------------------------------------------------------
  function loadForView(view) {
    if (view === "all") return loadSummary(false);
    if (view === "draft") return loadSummary(true);
    if (view === "live") return loadLive();
    render();
    return Promise.resolve();
  }

  // loadAllPages follows next_cursor until it's absent, instead of the
  // silent limit:100 truncation a single call would have (plan Task 9) — the
  // KB is documented as small by design (see kbstore's ReadPage doc), so a
  // capped loop of full pages is simpler than "load more" UI and still safe:
  // PAGE_SAFETY_CAP stops a pathological KB from looping forever, surfacing
  // that instead of truncating silently.
  var PAGE_SAFETY_CAP = 20; // 20 * 100 = 2000 records
  async function loadAllPages(toolName, baseArgs) {
    var items = [];
    var cursor;
    var lastPage = {};
    for (var i = 0; i < PAGE_SAFETY_CAP; i++) {
      var args = Object.assign({}, baseArgs, { limit: 100 });
      if (cursor) args.cursor = cursor;
      var page = await callTool(toolName, args);
      lastPage = page;
      items = items.concat(page.items || []);
      if (!page.next_cursor) { cursor = null; break; }
      cursor = page.next_cursor;
    }
    if (cursor) {
      console.warn("kb-manager widget: stopped paginating " + toolName + " after " + PAGE_SAFETY_CAP + " pages — results are incomplete");
    }
    return { items: items, draft_version: lastPage.draft_version };
  }

  async function loadSummary(draftOnly) {
    state.loading = true; state.error = null; render();
    try {
      var page = await loadAllPages("kb_summary", { types: state.typeFilter ? [state.typeFilter] : undefined });
      state.draftVersion = page.draft_version;
      var items = page.items;
      state.items = draftOnly ? items.filter(function (it) { return it.exists_in_draft; }) : items;
    } catch (e) {
      state.error = String((e && e.message) || e);
    }
    state.loading = false; render();
  }

  async function loadLive() {
    state.loading = true; state.error = null; render();
    try {
      var page = await loadAllPages("kb_read", {
        types: state.typeFilter ? [state.typeFilter] : undefined,
        source: "live", query: state.query || undefined,
      });
      state.items = page.items;
    } catch (e) {
      state.error = String((e && e.message) || e);
    }
    state.loading = false; render();
  }

  async function openRecord(type, key, backView) {
    state.recordBack = backView || (state.view === "record" ? "all" : state.view);
    state.view = "record";
    disarmDelete();
    // Uploads are per-record; keep only items that FAILED, so a user can still
    // see and retry them, and drop everything that already landed.
    state.uploads = keepFailedUploads(state.uploads);
    state.loading = true; state.error = null; state.record = null; render();
    try {
      var page = await callTool("kb_read", { types: [type], source: "both", key: key });
      state.record = { type: type, key: key, entries: page.items || [] };
    } catch (e) {
      state.error = String((e && e.message) || e);
    }
    state.loading = false; render();
  }

  // disarmDelete clears any armed confirmation. Called on every navigation
  // (back, tab switch, opening another record) so a confirmation armed on one
  // record can never be confirmed against a different one.
  function disarmDelete() {
    if (state.confirmDelete) state.confirmDelete = null;
  }

  // deleteRecord is now ONLY the tool call plus loading/error handling — all
  // arming and disarming lives in the confirmDelete state machine (see
  // renderRecordView and wireEvents). It never prompts.
  async function deleteRecord(type, key) {
    state.deleting = true;
    state.loading = true; state.error = null; render();
    try {
      await callTool("kb_delete", { type: type, key: key });
      state.deleting = false;
      state.view = state.recordBack || "all";
      await loadForView(state.view);
    } catch (e) {
      state.deleting = false;
      state.error = String((e && e.message) || e);
      state.loading = false; render();
    }
  }

  // ---------------------------------------------------------------------
  // Shape helpers for kb_read's { type, source, data } records
  // ---------------------------------------------------------------------
  function titleOf(type, data) {
    if (!data) return "";
    switch (type) {
      case "topic": return data.title || data.slug || "";
      case "product": return data.name || data.ref || "";
      case "tariff": return data.name || data.ref || "";
      case "delivery_zone": return data.name || data.ref || "";
      case "contacts": return "Контакты";
      case "policies": return "Политики";
      case "assistant": return "Ассистент";
      default: return "";
    }
  }
  function keyOf(type, data) {
    if (!data) return "";
    if (type === "topic") return data.slug || "";
    if (type === "contacts" || type === "policies" || type === "assistant") return "main";
    return data.ref || "";
  }
  function typeLabel(type) { return (TYPE_META[type] && TYPE_META[type].label) || type; }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function render() {
    var app = document.getElementById("app");
    // innerHTML below destroys and rebuilds every node, which would drop
    // keyboard focus (and cursor position) out of the search box on every
    // debounced re-render while the user is mid-search — save and restore
    // it across the rebuild.
    var active = document.activeElement;
    var focusId = active && active.id;
    var selStart = focusId && typeof active.selectionStart === "number" ? active.selectionStart : null;
    var selEnd = focusId && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

    var html = "";
    html += renderHeader();
    html += renderTabs();
    html += '<main>';
    if (state.connecting) {
      html += '<div class="loading">Подключение к Xchats…</div>';
    } else if (state.bridgeKind === "none") {
      html += renderDisconnected();
    } else if (state.view === "record") {
      html += renderRecordView();
    } else {
      html += renderListView();
    }
    html += '</main>';
    app.innerHTML = html;
    wireEvents();

    if (focusId) {
      var restored = document.getElementById(focusId);
      if (restored) {
        restored.focus();
        if (selStart != null && restored.setSelectionRange) restored.setSelectionRange(selStart, selEnd);
      }
    }
  }

  // reviewLink prefers the per-tool-call, organization-bound handoff URL
  // (state.reviewUrl) over the bare static frontendBaseUrl link — the latter
  // remains only as a fallback for a host/backend pairing that never supplies
  // one (SignReviewHandoff not configured, or no tool call has completed yet).
  function reviewLink() {
    if (state.reviewUrl) return state.reviewUrl;
    return state.frontendBaseUrl ? state.frontendBaseUrl + "/playground" : "";
  }

  function renderHeader() {
    var sub = state.draftVersion != null ? "версия черновика: " + esc(state.draftVersion) : "";
    var link = reviewLink();
    return '' +
      '<header class="topbar">' +
      '<div><h1>База знаний Xchats</h1><div class="sub">' + sub + '</div></div>' +
      '<div class="spacer"></div>' +
      (link
        ? '<a class="btn btn-primary" href="' + esc(link) + '" target="_blank" rel="noopener">Просмотреть и опубликовать в Xchats</a>'
        : '<span class="btn" style="opacity:.6">Xchats недоступен</span>') +
      '</header>';
  }

  function renderTabs() {
    // No "Медиа" tab: uploading now happens on the record itself, next to the
    // field the file is going into, so there is no standalone upload screen
    // and therefore no way to upload a file that attaches to nothing.
    var tabs = [["all", "Все"], ["live", "Опубликовано"], ["draft", "Черновик"]];
    var html = '<nav class="tabs">';
    tabs.forEach(function (t) {
      var active = (state.view === t[0]) || (state.view === "record" && state.recordBack === t[0]);
      html += '<button data-tab="' + t[0] + '" class="' + (active ? "active" : "") + '">' + esc(t[1]) + '</button>';
    });
    html += '</nav>';
    return html;
  }

  function renderDisconnected() {
    return '' +
      '<div class="empty">' +
      '<p><strong>Не удалось подключиться к Xchats.</strong></p>' +
      '<p>Этот хост не поддерживает вызов инструментов из виджета. Все функции остаются доступны модели через обычные MCP-инструменты.</p>' +
      '<p>Черновик и публикация доступны в разделе «Черновик» приложения Xchats.</p>' +
      '</div>';
  }

  function renderTypeChips() {
    var html = '<div class="toolbar">';
    html += '<button class="chip' + (state.typeFilter === null ? ' active' : '') + '" data-type-filter="">Все типы</button>';
    ALL_TYPES.forEach(function (t) {
      html += '<button class="chip' + (state.typeFilter === t ? ' active' : '') + '" data-type-filter="' + t + '">' + esc(typeLabel(t)) + '</button>';
    });
    if (state.view === "live") {
      html += '<input type="search" id="query-box" placeholder="Поиск по названию…" value="' + esc(state.query) + '" style="margin-left:auto">';
    }
    html += '</div>';
    return html;
  }

  function renderListView() {
    var html = "";
    if (state.error) html += '<div class="error-box">' + esc(state.error) + '</div>';
    if (state.view === "draft") {
      var draftLink = reviewLink();
      html += '<div class="publish-banner"><p>Черновик содержит несохранённые изменения. Публикация подтверждается человеком в Xchats.</p>' +
        (draftLink
          ? '<a class="btn btn-primary btn-sm" href="' + esc(draftLink) + '" target="_blank" rel="noopener">Открыть в Xchats</a>'
          : '') + '</div>';
    }
    html += renderTypeChips();
    if (state.loading) { html += '<div class="loading">Загрузка…</div>'; return html; }
    if (!state.items.length) {
      html += '<div class="empty">' + (state.view === "draft" ? "Черновик пуст." : "Ничего не найдено.") + '</div>';
      return html;
    }
    if (state.view === "live") {
      state.items.forEach(function (rec) {
        html += renderRecordRow(rec.type, keyOf(rec.type, rec.data), titleOf(rec.type, rec.data), [
          ["badge-live", "Опубликовано"],
        ]);
      });
    } else {
      state.items.forEach(function (it) {
        html += renderRecordRow(it.type, it.key, it.title || it.key, [
          ["badge-" + it.state, STATE_LABELS[it.state] || it.state],
        ]);
      });
    }
    return html;
  }

  function renderRecordRow(type, key, title, badges) {
    var badgeHtml = badges.map(function (b) { return '<span class="badge ' + b[0] + '">' + esc(b[1]) + '</span>'; }).join(" ");
    return '' +
      '<div class="card row-card" data-open-type="' + esc(type) + '" data-open-key="' + esc(key) + '">' +
      '<div class="row-main">' +
      '<div class="row-title">' + esc(title || key) + '</div>' +
      '<div class="row-sub">' + esc(typeLabel(type)) + ' · <code>' + esc(key) + '</code></div>' +
      '</div>' + badgeHtml +
      '</div>';
  }

  function renderRecordView() {
    var html = '<button class="back-link" data-back="1">← Назад</button>';
    if (state.error) html += '<div class="error-box">' + esc(state.error) + '</div>';
    if (state.loading) { html += '<div class="loading">Загрузка…</div>'; return html; }
    if (!state.record) { html += '<div class="empty">Запись не найдена.</div>'; return html; }
    var entries = state.record.entries || [];
    if (!entries.length) {
      html += '<div class="empty">Запись «' + esc(state.record.key) + '» не найдена ни в опубликованной версии, ни в черновике.</div>';
      return html;
    }
    entries.forEach(function (rec) {
      html += '<div class="source-block">';
      html += '<h3>' + (rec.source === "draft" ? "Черновик" : "Опубликовано") + '</h3>';
      html += renderFields(rec.data || {});
      html += '</div>';
    });
    // The media section is rendered ONCE per record, never once per source
    // block: renderFields runs for the draft AND live entries, so anything
    // carrying an id or a data-attribute inside it would be emitted twice and
    // the singular querySelector wiring would only ever reach the first copy.
    html += renderMediaSection();
    html += renderDeleteControl();
    return html;
  }

  // renderDeleteControl is the two-step confirmation. Step one arms
  // state.confirmDelete and re-renders; only step two calls kb_delete.
  function renderDeleteControl() {
    if (!state.confirmDelete) {
      return '<div style="margin-top:10px"><button class="btn btn-danger" data-delete-type="' + esc(state.record.type) +
        '" data-delete-key="' + esc(state.record.key) + '">Удалить (пометить в черновике)</button></div>';
    }
    // An inline card rather than an overlay: the style block has no
    // position:fixed, z-index or backdrop, and the widget's iframe is short.
    return '<div class="card" id="confirm-delete" style="border-color:var(--danger);margin-top:10px" role="alertdialog" aria-live="polite">' +
      '<p>Пометить «' + esc(state.confirmDelete.key) + '» на удаление в черновике? ' +
      'Запись останется опубликованной до подтверждения в Xchats.</p>' +
      '<button class="btn btn-danger btn-sm" id="confirm-delete-yes" data-confirm-delete="1"' +
      (state.deleting ? " disabled" : "") + '>' + (state.deleting ? "Удаление…" : "Удалить") + '</button> ' +
      '<button class="btn btn-sm" id="confirm-delete-no" data-cancel-delete="1"' +
      (state.deleting ? " disabled" : "") + '>Отмена</button>' +
      '</div>';
  }

  function renderFields(data) {
    var html = "";
    var keys = Object.keys(data);
    if (!keys.length) return '<div class="empty">Нет данных.</div>';
    keys.forEach(function (k) {
      var v = data[k];
      var isMedia = !!state.mediaFieldKinds[k];
      var valueHtml;
      // isEmpty is tracked explicitly rather than sniffed out of the generated
      // HTML with indexOf("empty-val") — a filename containing that literal
      // would otherwise grey out a perfectly populated row.
      var isEmpty = false;
      if (v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)) {
        valueHtml = '<span class="empty-val">не задано</span>';
        isEmpty = true;
      } else if (isMedia) {
        // Deliberately NON-interactive: no ids, no data-attributes, because
        // renderFields is called once per source block (draft AND live).
        // Filenames come from the kb_read _meta index when the host passed it
        // through; the short uuid is the fallback.
        var ids = Array.isArray(v) ? v : [v];
        valueHtml = ids.map(function (id) {
          var meta = state.mediaIndex[String(id)];
          var label = (meta && meta.filename) ? meta.filename : String(id).slice(0, 8) + "…";
          return '<span class="media-chip">' + esc(label) + '</span>';
        }).join(" ");
      } else if (typeof v === "boolean") {
        valueHtml = v ? "Да" : "Нет";
      } else if (Array.isArray(v)) {
        valueHtml = esc(v.join(", "));
      } else if (typeof v === "object") {
        valueHtml = '<code>' + esc(JSON.stringify(v)) + '</code>';
      } else {
        valueHtml = esc(v);
      }
      html += '<div class="field-row"><div class="field-label">' + esc(humanize(k)) + '</div><div class="field-value' +
        (isEmpty ? " empty-val" : "") + '">' + valueHtml + '</div></div>';
    });
    return html;
  }

  // ---------------------------------------------------------------------
  // Record media: preview what is attached, upload more.
  //
  // Every media control lives HERE, in one section rendered once per record —
  // never inside renderFields, which runs once per source block (draft AND
  // live) and would therefore emit duplicate ids and duplicate inputs.
  //
  // Only IMAGES render inline. Video, audio and documents render as an icon,
  // a filename, a size and a link: blob.Store.Get reads a whole file into
  // server memory (there is no streaming read yet), so nothing but images is
  // fetched without the user explicitly asking for it.
  // ---------------------------------------------------------------------
  var KIND_LABELS = { image: "изображения", video: "видео", audio: "аудио", document: "документы" };
  var KIND_ICONS = { image: "🖼", video: "🎬", audio: "🎵", document: "📄" };
  var KIND_ACCEPT = { image: "image/*", video: "video/*", audio: "audio/*", document: "application/*,text/*" };

  // classifyMime mirrors kbstore.mimeMatchesKind (mcp_media.go) exactly, so
  // a file the widget accepts is a file the server will too.
  function classifyMime(mime) {
    if (mime.indexOf("image/") === 0) return "image";
    if (mime.indexOf("video/") === 0) return "video";
    if (mime.indexOf("audio/") === 0) return "audio";
    if (mime.indexOf("application/") === 0 || mime.indexOf("text/") === 0) return "document";
    return null;
  }

  function formatBytes(n) {
    if (!n && n !== 0) return "";
    if (n < 1024) return n + " Б";
    if (n < 1024 * 1024) return Math.round(n / 1024) + " КБ";
    return (n / (1024 * 1024)).toFixed(1).replace(".", ",") + " МБ";
  }

  // fieldDefFor resolves ONE {field, kind, multiple} from the type-scoped
  // registry kb_info publishes. A field absent from it is not attachable —
  // that is what makes featured_image preview-only in this editor while
  // remaining a perfectly real, upsert-writable column.
  function fieldDefFor(type, field) {
    var fields = (state.mediaAttachmentFields && state.mediaAttachmentFields[type]) || [];
    for (var i = 0; i < fields.length; i++) {
      if (fields[i].field === field) return fields[i];
    }
    return null;
  }

  // primaryEntry picks the draft row when there is one, else live: every
  // attach writes the draft, so the draft is what the editor must reflect.
  function primaryEntry() {
    var entries = (state.record && state.record.entries) || [];
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].source === "draft") return entries[i];
    }
    return entries[0] || null;
  }

  // mediaFieldsFor answers two SEPARATE questions and never conflates them:
  //
  //   displayed  — the key is actually present on the record data returned by
  //                kb_read, and mediaFieldKinds recognises it as media.
  //   attachable — the field is listed under mediaAttachmentFields[type].
  //
  // So a real column can be shown while being non-attachable (featured_image),
  // and a registry entry can never conjure a UI field for a column the record
  // does not have.
  function mediaFieldsFor(type, data) {
    var out = [];
    if (!data) return out;
    var registry = (state.mediaAttachmentFields && state.mediaAttachmentFields[type]) || [];
    var seen = {};
    registry.forEach(function (def) {
      if (!Object.prototype.hasOwnProperty.call(data, def.field)) return;
      if (!state.mediaFieldKinds[def.field]) return;
      seen[def.field] = true;
      out.push({ field: def.field, kind: def.kind, multiple: !!def.multiple, attachable: true });
    });
    Object.keys(data).forEach(function (k) {
      if (seen[k]) return;
      var kind = state.mediaFieldKinds[k];
      if (!kind) return;
      out.push({ field: k, kind: kind, multiple: Array.isArray(data[k]), attachable: false });
    });
    return out;
  }

  function renderMediaSection() {
    var entry = primaryEntry();
    if (!entry) return "";
    var data = entry.data || {};
    var fields = mediaFieldsFor(state.record.type, data);
    if (!fields.length) return "";

    var html = '<div class="source-block"><h3>Медиа</h3>' +
      '<p class="row-sub">Загрузка добавляет файл в черновик — опубликуйте изменения в Xchats.</p>';
    fields.forEach(function (def) {
      html += renderMediaField(def, data[def.field]);
    });
    html += '</div>';
    return html;
  }

  function renderMediaField(def, value) {
    var ids = value === null || value === undefined || value === "" ? []
      : (Array.isArray(value) ? value : [value]);
    var label = esc(humanize(def.field));
    if (!def.attachable) label += ' <span class="row-sub">(только предпросмотр)</span>';
    else if (!def.multiple) label += ' <span class="row-sub">(один файл, заменяет текущий)</span>';

    var html = '<div class="media-field" data-drop-field="' + esc(def.field) + '">';
    html += '<div class="field-label">' + label + '</div>';

    if (!ids.length) {
      html += '<div class="field-value empty-val"><span class="empty-val">не задано</span></div>';
    } else {
      html += '<div class="media-grid">';
      ids.forEach(function (id) { html += renderMediaItem(String(id), def.kind); });
      html += '</div>';
      if (def.attachable && !def.multiple) {
        html += '<p class="row-sub">будет заменено</p>';
      }
    }

    if (def.attachable) {
      html += '<div><input type="file" id="up-input-' + esc(def.field) + '" data-upload-field="' + esc(def.field) + '"' +
        (def.multiple ? " multiple" : "") + ' accept="' + esc(KIND_ACCEPT[def.kind] || "") + '"></div>';
      html += '<p class="row-sub">' + esc(KIND_LABELS[def.kind] || "файлы") +
        ', до ' + formatBytes(MAX_UPLOAD_BYTES) +
        (def.multiple ? ' · можно выбрать несколько' : '') + '.</p>';
    } else {
      html += '<p class="row-sub">задаётся через kb_*_upsert; пусто — берётся первое изображение</p>';
    }

    if (state.uploadNotes[def.field]) {
      html += '<p class="row-sub">' + esc(state.uploadNotes[def.field]) + '</p>';
    }
    html += renderUploadQueue(def.field);
    html += '</div>';
    return html;
  }

  // renderMediaItem: images inline, everything else an icon + name + size +
  // link. No <video>/<audio> elements are ever emitted.
  function renderMediaItem(id, fieldKind) {
    var meta = state.mediaIndex[id];
    if (!meta || !meta.url) {
      return '<span class="media-chip">' + esc(id.slice(0, 8)) + '… · предпросмотр недоступен</span>';
    }
    var kind = meta.kind || fieldKind;
    var name = meta.filename || id;
    var size = meta.size_bytes ? formatBytes(meta.size_bytes) : "";
    if (kind === "image") {
      return '<a class="media-open" href="' + esc(meta.url) + '" target="_blank" rel="noopener" referrerpolicy="no-referrer" title="' + esc(name) + '">' +
        '<img class="media-thumb" src="' + esc(meta.url) + '" alt="' + esc(name) + '" loading="lazy" referrerpolicy="no-referrer">' +
        '</a>';
    }
    return '<a class="media-doc" href="' + esc(meta.url) + '" target="_blank" rel="noopener" referrerpolicy="no-referrer">' +
      '<span>' + (KIND_ICONS[kind] || KIND_ICONS.document) + '</span>' +
      '<span>' + esc(name) + '</span>' +
      (size ? '<span class="row-sub">' + esc(size) + '</span>' : "") +
      '</a>';
  }

  var UPLOAD_STATUS_LABELS = {
    queued: "В очереди…", staging: "Подготовка…", uploading: "Загрузка…",
    attaching: "Прикрепление…", done: "Готово", error: "Ошибка",
  };

  function renderUploadQueue(field) {
    var items = state.uploads[field] || [];
    if (!items.length) return "";
    var html = "";
    items.forEach(function (item) {
      html += '<div class="upload-item" id="' + esc(item.id) + '">';
      html += '<div class="row-sub">' + esc(item.name) + (item.size ? ' · ' + formatBytes(item.size) : "") + '</div>';
      if (item.status === "uploading") {
        html += '<div class="progress-bar"><div id="' + esc(item.id) + '-bar" style="width:' + item.progress + '%"></div></div>';
      }
      if (item.status === "error") {
        html += '<div class="error-box">' + esc(item.error || "Не удалось загрузить файл") + '</div>';
        html += '<button class="btn btn-sm" data-retry-upload="' + esc(item.id) + '">Повторить</button> ' +
          '<button class="btn btn-sm" data-dismiss-upload="' + esc(item.id) + '">Убрать</button>';
      } else {
        html += '<div class="row-sub">' + esc(UPLOAD_STATUS_LABELS[item.status] || item.status) + '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  // ---------------------------------------------------------------------
  // Upload queue. One global worker, strictly sequential: handleMCPUpload
  // reads each body fully into memory, and every kb_media_attach takes the
  // organization's draft row lock, so parallel uploads would buy nothing but
  // server RSS and ErrStale retries.
  // ---------------------------------------------------------------------
  function allUploadItems() {
    var out = [];
    Object.keys(state.uploads).forEach(function (f) {
      (state.uploads[f] || []).forEach(function (it) { out.push(it); });
    });
    return out;
  }
  function findUploadItem(id) {
    var all = allUploadItems();
    for (var i = 0; i < all.length; i++) { if (all[i].id === id) return all[i]; }
    return null;
  }
  function hasActiveUploads() {
    return allUploadItems().some(function (it) {
      return it.status === "queued" || it.status === "staging" || it.status === "uploading" || it.status === "attaching";
    });
  }
  // keepFailedUploads drops everything that finished cleanly and keeps the
  // failures, so a refresh after a batch does not silently swallow the one
  // file that did not make it.
  function keepFailedUploads(uploads) {
    var out = {};
    Object.keys(uploads || {}).forEach(function (f) {
      var failed = (uploads[f] || []).filter(function (it) { return it.status === "error"; });
      if (failed.length) out[f] = failed;
    });
    return out;
  }

  function handleFieldFiles(field, fileList) {
    if (!state.record) return;
    var def = fieldDefFor(state.record.type, field);
    if (!def) return;
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    delete state.uploadNotes[field];
    if (!def.multiple && files.length > 1) {
      files = files.slice(0, 1);
      state.uploadNotes[field] = "Поле принимает один файл — остальные пропущены.";
    }
    var queue = state.uploads[field] || (state.uploads[field] = []);
    files.forEach(function (file) {
      var mime = file.type || "application/octet-stream";
      var kind = classifyMime(mime);
      var item = {
        id: "up-" + (++state.uploadSeq), field: field, kind: kind, mime: mime,
        name: file.name, size: file.size, file: file,
        recType: state.record.type, recKey: state.record.key,
        status: "queued", progress: 0, error: null,
        materialId: null, uploadUrl: null, uploadHeaders: null, expiresAt: null,
        uploaded: false, // bytes have landed; the signed target is now spent
      };
      // Validate per FILE, never globally: one rejected file in a batch of
      // five must not discard the other four.
      if (kind !== def.kind) {
        item.status = "error";
        item.error = "Поле принимает " + (KIND_LABELS[def.kind] || def.kind) + "; «" + file.name + "» — " +
          (kind ? KIND_LABELS[kind] : mime) + ".";
      } else if (!file.size) {
        item.status = "error"; item.error = "Файл пуст.";
      } else if (file.size > MAX_UPLOAD_BYTES) {
        item.status = "error";
        item.error = "Файл слишком большой: " + formatBytes(file.size) + " (максимум " + formatBytes(MAX_UPLOAD_BYTES) + ").";
      }
      queue.push(item);
    });
    render();
    pumpUploadQueue();
  }

  var uploadPumpRunning = false;
  async function pumpUploadQueue() {
    if (uploadPumpRunning) return;
    uploadPumpRunning = true;
    var ran = false;
    try {
      for (;;) {
        var next = allUploadItems().filter(function (it) { return it.status === "queued"; })[0];
        if (!next) break;
        ran = true;
        await runUploadItem(next);
      }
    } finally {
      uploadPumpRunning = false;
    }
    // Re-read the record once the batch drains: fresh media ids AND fresh
    // signed preview URLs, both of which only the server can supply.
    if (ran && state.view === "record" && state.record) {
      await openRecord(state.record.type, state.record.key, state.recordBack);
    }
  }

  // runUploadItem resumes from the first INCOMPLETE phase: stage → PUT →
  // attach. That matters on retry — a signed upload target is one-shot
  // server-side (CompleteMaterialUpload's guarded transition), so once the
  // bytes have landed a second PUT is a hard 409 and the item could never
  // recover. The common case is exactly that: the PUT succeeded, the ATTACH
  // failed, and retry must re-attach rather than re-upload.
  async function runUploadItem(item) {
    if (item.uploaded) {
      await attachUploadItem(item);
      return;
    }
    // Re-PUT the SAME signed target on a retry; stage again only when there
    // is no target yet or the signed one has genuinely expired.
    if (!item.uploadUrl || isItemExpired(item)) {
      item.status = "staging"; item.error = null; render();
      try {
        // target is declared in kb_media_upload's input schema (tools.go), so
        // sending it is not a contract change — it makes the server mark the
        // material customer_visibility='visible' and validate the type/field
        // pairing at staging time rather than at attach time.
        var out = await callTool("kb_media_upload", {
          filename: item.name, mime_type: item.mime, size_bytes: item.size,
          target: { type: item.recType, field: item.field },
        });
        item.materialId = out.material_id;
        item.uploadUrl = out.upload_url;
        item.uploadHeaders = out.upload_headers || {};
        item.expiresAt = out.expires_at || null;
      } catch (e) {
        item.status = "error"; item.error = String((e && e.message) || e); render();
        return;
      }
    }
    item.status = "uploading"; item.progress = 0; item.error = null; render();
    try {
      await putUploadBytes(item);
      // The bytes are now server-side and this target is spent. Recorded
      // BEFORE the attach, so a failed attach retries the attach alone.
      item.uploaded = true;
    } catch (e) {
      item.status = "error";
      if (!item.error) item.error = String((e && e.message) || e);
      render();
      return;
    }
    await attachUploadItem(item);
  }

  async function attachUploadItem(item) {
    item.status = "attaching"; item.error = null; render();
    try {
      await callTool("kb_media_attach", {
        material_id: item.materialId, type: item.recType, key: item.recKey, field: item.field,
      });
      applyAttachedMaterial(item);
      item.status = "done"; render();
    } catch (e) {
      // ChatGPT caches a connector's tools/list. kb_media_attach was added
      // after kb_media_upload, so an already-connected app can know how to
      // stage the bytes but have the host reject the later attach call with
      // "MCP Resource not found" before it ever reaches Xchats. The typed
      // upsert tools predate both media tools, so use the matching upsert as
      // a narrow compatibility path for that host-level stale-manifest error.
      // Every other attach failure remains visible and retryable.
      if (isMissingAttachToolError(e)) {
        try {
          await attachUploadItemViaUpsert(item);
          applyAttachedMaterial(item);
          item.status = "done"; render();
          return;
        } catch (fallbackErr) {
          e = fallbackErr;
        }
      }
      item.status = "error";
      item.error = "Файл загружен, но не прикреплён: " + String((e && e.message) || e);
      render();
    }
  }

  function isMissingAttachToolError(err) {
    var message = String((err && err.message) || err || "").toLowerCase();
    return message.indexOf("mcp resource not found") !== -1 ||
      message.indexOf("unknown tool: kb_media_attach") !== -1 ||
      message.indexOf("method not found") !== -1;
  }

  async function attachUploadItemViaUpsert(item) {
    var toolByType = {
      topic: "kb_topic_upsert", product: "kb_product_upsert", tariff: "kb_tariff_upsert",
      contacts: "kb_contacts_upsert", policies: "kb_policies_upsert",
    };
    var tool = toolByType[item.recType];
    var def = fieldDefFor(item.recType, item.field);
    var entry = primaryEntry();
    if (!tool || !def || !entry) throw new Error("нет совместимого инструмента для прикрепления");

    var value = item.materialId;
    if (def.multiple) {
      var current = entry.data && entry.data[item.field];
      value = Array.isArray(current) ? current.slice() : [];
      if (value.indexOf(item.materialId) === -1) value.push(item.materialId);
    }
    var changes = {}; changes[item.field] = value;
    var args = { changes: changes };
    if (item.recType === "topic") args.slug = item.recKey;
    else if (item.recType === "product" || item.recType === "tariff") args.ref = item.recKey;
    await callTool(tool, args);
  }

  // Keep the primary record snapshot current between sequential files. This
  // matters when a stale ChatGPT manifest forces two plural attachments
  // through the upsert fallback before the batch's final kb_read refresh.
  function applyAttachedMaterial(item) {
    var entry = primaryEntry();
    var def = fieldDefFor(item.recType, item.field);
    if (!entry || !entry.data || !def) return;
    if (!def.multiple) {
      entry.data[item.field] = item.materialId;
      return;
    }
    var current = Array.isArray(entry.data[item.field]) ? entry.data[item.field] : [];
    if (current.indexOf(item.materialId) === -1) current.push(item.materialId);
    entry.data[item.field] = current;
  }

  function isItemExpired(item) {
    if (!item.expiresAt) return false;
    var t = Date.parse(item.expiresAt);
    return !isNaN(t) && Date.now() >= t;
  }

  function putUploadBytes(item) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open("PUT", item.uploadUrl, true);
      var headers = item.uploadHeaders || {};
      Object.keys(headers).forEach(function (h) { xhr.setRequestHeader(h, headers[h]); });
      xhr.upload.onprogress = function (ev) {
        if (!ev.lengthComputable) return;
        item.progress = Math.round((ev.loaded / ev.total) * 100);
        // Paint ONE node. Calling render() here would rebuild the whole
        // document many times a second and destroy every other field's
        // in-flight <input type="file"> mid-batch.
        paintUploadProgress(item);
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) { resolve(); return; }
        // 403 is what an expired/invalid signed token returns
        // (internal/httpapi/mcp_upload.go) — the one failure a plain re-PUT
        // cannot fix, so say so and let retry re-stage.
        item.error = xhr.status === 403
          ? "Срок действия ссылки для загрузки истёк. Нажмите «Повторить», чтобы начать заново."
          : "Загрузка не удалась (" + xhr.status + ")";
        reject(new Error("upload failed"));
      };
      xhr.onerror = function () {
        item.error = "Сетевая ошибка при загрузке";
        reject(new Error("network error"));
      };
      xhr.send(item.file);
    });
  }

  function paintUploadProgress(item) {
    var bar = document.getElementById(item.id + "-bar");
    if (bar) bar.style.width = item.progress + "%";
  }

  function retryUploadItem(id) {
    var item = findUploadItem(id);
    if (!item || !item.file) return;
    item.status = "queued"; item.error = null; item.progress = 0;
    render();
    pumpUploadQueue();
  }

  function dismissUploadItem(id) {
    Object.keys(state.uploads).forEach(function (f) {
      state.uploads[f] = (state.uploads[f] || []).filter(function (it) { return it.id !== id; });
      if (!state.uploads[f].length) delete state.uploads[f];
    });
    render();
  }

  // ---------------------------------------------------------------------
  // Event wiring — re-attached after every render() since innerHTML replaces
  // the whole subtree.
  // ---------------------------------------------------------------------
  function wireEvents() {
    var app = document.getElementById("app");

    app.querySelectorAll("nav.tabs button[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.view = btn.getAttribute("data-tab");
        state.error = null;
        disarmDelete();
        loadForView(state.view);
      });
    });

    var back = app.querySelector("[data-back]");
    if (back) back.addEventListener("click", function () {
      state.view = state.recordBack || "all";
      disarmDelete();
      loadForView(state.view);
    });

    app.querySelectorAll("[data-open-type]").forEach(function (el) {
      el.addEventListener("click", function () {
        openRecord(el.getAttribute("data-open-type"), el.getAttribute("data-open-key"), state.view);
      });
    });

    // Two-step delete. Step one only ARMS the confirmation — querySelectorAll,
    // not querySelector, because singular wiring is exactly how a second
    // control of the same kind silently stops working.
    app.querySelectorAll("[data-delete-type]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.confirmDelete = { type: el.getAttribute("data-delete-type"), key: el.getAttribute("data-delete-key") };
        render();
      });
    });
    app.querySelectorAll("[data-confirm-delete]").forEach(function (el) {
      el.addEventListener("click", function () {
        var target = state.confirmDelete;
        if (!target || state.deleting) return;
        state.confirmDelete = null;
        deleteRecord(target.type, target.key);
      });
    });
    app.querySelectorAll("[data-cancel-delete]").forEach(function (el) {
      el.addEventListener("click", function () {
        if (state.deleting) return;
        state.confirmDelete = null;
        render();
      });
    });

    // Per-field media upload: one input per attachable field, wired plurally
    // and keyed by the field name rather than a shared id.
    app.querySelectorAll("[data-upload-field]").forEach(function (input) {
      input.addEventListener("change", function () {
        if (input.files && input.files.length) handleFieldFiles(input.getAttribute("data-upload-field"), input.files);
      });
    });
    app.querySelectorAll("[data-drop-field]").forEach(function (zone) {
      var field = zone.getAttribute("data-drop-field");
      zone.addEventListener("dragover", function (ev) { ev.preventDefault(); zone.classList.add("drag"); });
      zone.addEventListener("dragleave", function () { zone.classList.remove("drag"); });
      zone.addEventListener("drop", function (ev) {
        ev.preventDefault();
        zone.classList.remove("drag");
        if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) {
          handleFieldFiles(field, ev.dataTransfer.files);
        }
      });
    });
    // A signed preview URL can expire while a record sits open, and a host may
    // block the request outright — degrade to the alt text instead of a
    // broken-image glyph. Wired here rather than as an inline onerror.
    app.querySelectorAll("img.media-thumb").forEach(function (img) {
      img.addEventListener("error", function () { img.classList.add("media-broken"); });
    });
    app.querySelectorAll("[data-retry-upload]").forEach(function (el) {
      el.addEventListener("click", function () { retryUploadItem(el.getAttribute("data-retry-upload")); });
    });
    app.querySelectorAll("[data-dismiss-upload]").forEach(function (el) {
      el.addEventListener("click", function () { dismissUploadItem(el.getAttribute("data-dismiss-upload")); });
    });

    app.querySelectorAll("[data-type-filter]").forEach(function (el) {
      el.addEventListener("click", function () {
        var t = el.getAttribute("data-type-filter");
        state.typeFilter = t === "" ? null : t;
        loadForView(state.view);
      });
    });

    var qbox = app.querySelector("#query-box");
    if (qbox) {
      var qTimer = null;
      qbox.addEventListener("input", function () {
        state.query = qbox.value;
        clearTimeout(qTimer);
        qTimer = setTimeout(function () { loadLive(); }, 350);
      });
    }

  }

  boot();
})();
</script>
</body>
</html>
