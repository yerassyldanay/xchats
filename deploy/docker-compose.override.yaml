# Local override: host :8080 is already taken so remap the backend's published
# port to 8090. The compose network is unaffected — frontend still reaches the
# backend at backend:8080 internally.
#
# `!override` REPLACES the base port list instead of appending to it.
#
# Apply alongside the base file, loading the root .env for interpolation:
#   docker compose --env-file ./.env -p xchats \
#     -f deploy/docker-compose.yaml -f deploy/docker-compose.override.yaml up --build
services:
  backend:
    ports: !override
      - "8090:8080"   # host 8080 is taken
    environment:
      # The base file's default assumes the base port mapping (8080:8080); this
      # override republishes the backend on 8090, so the self-advertised
      # discovery origin has to follow. Still overridable from .env — set
      # API_BASE_URL to a public tunnel URL when an external MCP host
      # (ChatGPT/Claude) needs to reach the connector.
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8090}"
  frontend:
    ports: !override
      - "8081:80"     # unchanged; 8081 is free
    # Read-only bind mount for the eval comparison UI (frontend/nginx.conf's
    # /evals-data/ location) — LOCAL-DEV ONLY, deliberately kept out of the base
    # compose file: evals/runs/ holds raw model replies, prompts, and KB material
    # with no auth in front of it. A deploy built from docker-compose.yaml alone
    # never gets this mount, so /evals-data/ simply 404s there.
    volumes:
      - ../evals/runs:/evals-runs:ro
