# One-command stack: xchats backend + xchats frontend (SQLite — no Postgres needed).
# WhatsApp connects directly via go.mau.fi/whatsmeow (internal/whatsmeow) — no
# external gateway to run or point at; pair a number from the UI's QR flow.
#
# Host port mappings are parametric — override BACKEND_PORT/FRONTEND_PORT
# (shell env, or a root .env compose auto-loads) when the defaults collide
# with something else already running; the internal container ports (8080 /
# 80) and the service-to-service addressing (frontend -> backend:8080) never
# change, only what's published to the host. See docs/release/docker.md.
services:
  backend:
    build:
      context: ../backend
    environment:
      # Boot/infra tunables (listen address, on-disk paths, logging, worker
      # counts) live in the mounted config.docker.yaml, not here — this block
      # is only what genuinely needs a per-deployment override or is still a
      # secret (Track 2 auto-provisions those into the credential store
      # instead; until then they stay here).
      XCHATS_CONFIG: "/config.yaml"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:${FRONTEND_PORT:-8081}}"
      # --- MCP connector (plan/mcp.md) ---
      # API_BASE_URL is the backend's own PUBLIC origin, and it is the single
      # source of every OAuth/MCP discovery URL this server advertises (issuer,
      # authorize/token/jwks endpoints, and the RFC 8707 resource the access
      # token's audience is bound to). It is deliberately NOT derived from the
      # request's Host header, so it must be set to whatever an MCP host
      # actually dials — a tunnel/public HTTPS URL when the connector is reached
      # from outside this machine, not the in-container port.
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}"
      # FRONTEND_BASE_URL is where the KB Manager widget's "Review and publish
      # in Xchats" link lands — the frontend service below, as reachable from
      # the operator's own browser (a host-published port, never "frontend:80").
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:${FRONTEND_PORT:-8081}}"
      # Unset => an ephemeral per-process key: every MCP token stops verifying
      # on restart, and no two replicas agree. Fine for a throwaway local run,
      # never for anything an LLM host stays connected to.
      MCP_JWT_SIGNING_KEY: "${MCP_JWT_SIGNING_KEY:-}"
      # --- Telegram (Bot API) ---
      TG_WEBHOOK_PUBLIC_BASE_URL: "${TG_WEBHOOK_PUBLIC_BASE_URL:-}"
      TG_API_BASE_URL: "${TG_API_BASE_URL:-}"
      TG_WEBHOOK_SECRET: "${TG_WEBHOOK_SECRET:-}"
      TG_CREDENTIALS_ENC_KEY: "${TG_CREDENTIALS_ENC_KEY:-}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-random}"
      # Legacy brain/playground config — those packages stay compiled but are no
      # longer constructed by main.go; kept only for internal/kbstore consumers.
      LLM_PROVIDER: "${LLM_PROVIDER:-openrouter}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_FAST_MODEL: "${LLM_FAST_MODEL:-openai/gpt-4o-mini}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-1024}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.3}"
      # response.Service's LLM layer — required; boot fails fast without a key
      # for LLM_DEFAULT_PROVIDER (no stub fallback, by design).
      LLM_DEFAULT_PROVIDER: "${LLM_DEFAULT_PROVIDER:-openrouter}"
      LLM_DEFAULT_MODEL: "${LLM_DEFAULT_MODEL:-google/gemini-2.5-flash}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-}"
      LLM_DRAFT_MAX_TOKENS: "${LLM_DRAFT_MAX_TOKENS:-500}"
      LLM_DRAFT_TEMPERATURE: "${LLM_DRAFT_TEMPERATURE:-0.3}"
      LLM_DRAFT_TIMEOUT_SECONDS: "${LLM_DRAFT_TIMEOUT_SECONDS:-60}"
      LLM_DRAFT_RETRY: "${LLM_DRAFT_RETRY:-true}"
      # Simulator HTTP API (Phase 10) — gates whether the route is registered
      # at all. Default false; set true to test without a WhatsApp number.
      SIMULATOR_ENABLED: "${SIMULATOR_ENABLED:-false}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.docker.yaml:/config.yaml:ro
      - blobdata:/data/blob
      - sqlitedata:/data

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  blobdata:
  sqlitedata:
