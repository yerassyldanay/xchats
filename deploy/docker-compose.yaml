# One-command stack: xchats backend + xchats frontend (SQLite — no Postgres needed).
# WhatsApp connects directly via go.mau.fi/whatsmeow (internal/whatsmeow) — no
# external gateway to run or point at; pair a number from the UI's QR flow.
#
# `make up` and nothing else: this is the ONLY compose file, there is no
# override file and no .env to create. Application settings all live in the
# mounted config.docker.yaml; secrets auto-provision on first boot; provider
# keys and integrations are configured from the Settings UI afterwards.
#
# The only knobs here are the two host port mappings, kept parametric for the
# one case that genuinely varies per machine — a port already in use. They
# default to 8080/8081 with nothing set; export BACKEND_PORT/FRONTEND_PORT for
# that run to move them. The internal container ports (8080 / 80) and the
# service-to-service addressing (frontend -> backend:8080) never change, only
# what is published to the host. See docs/release/docker.md.
services:
  backend:
    build:
      context: ../backend
    environment:
      # Boot/infra tunables (listen address, on-disk paths, logging, worker
      # counts) live in the mounted config.docker.yaml, not here — this block
      # is only what genuinely needs a per-deployment override. Every secret
      # (session/CSRF signing, Telegram token encryption, MCP JWT signing,
      # the Telegram webhook secret_token) is auto-provisioned into the file-
      # backed credential store on first boot (internal/credentials.Provision)
      # and persisted under the /data volume below — there is nothing to set
      # here for them anymore. LLM provider keys and the default provider/
      # model are likewise configured after first boot, from the Settings UI
      # (or its first-run setup wizard) — never here.
      XCHATS_CONFIG: "/config.yaml"
      # internal/credentials' file-backed fallback (Keyring has no OS session
      # to run in inside a container) and internal/settings' JSON store both
      # live under the persistent /data volume already mounted below, not
      # the container's own (ephemeral, throwaway-on-recreate) $HOME.
      XCHATS_ALLOW_FILE_CREDENTIALS: "1"
      XCHATS_DATA_DIR: "/data/appdata"
      XCHATS_CONFIG_DIR: "/data/appconfig"
      # Nothing else belongs here. Every remaining boot/infra setting — the
      # public base URLs, CORS origins, Telegram mode/webhook origin, the
      # simulator gate — lives in the mounted config.docker.yaml above.
      # internal/config.Load applies env AFTER yaml, so re-declaring any of
      # them here as `VAR: "${VAR:-default}"` would always be set and would
      # silently override the yaml, making that file unusable. That is exactly
      # the trap this block used to be.
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.docker.yaml:/config.yaml:ro
      - blobdata:/data/blob
      - sqlitedata:/data

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  blobdata:
  sqlitedata:
