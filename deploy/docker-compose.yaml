# One-command stack: xchats backend + xchats frontend (SQLite — no Postgres needed).
# WhatsApp connects directly via go.mau.fi/whatsmeow (internal/whatsmeow) — no
# external gateway to run or point at; pair a number from the UI's QR flow.
#
# Host port mappings are parametric — override BACKEND_PORT/FRONTEND_PORT
# (shell env, or a root .env compose auto-loads) when the defaults collide
# with something else already running; the internal container ports (8080 /
# 80) and the service-to-service addressing (frontend -> backend:8080) never
# change, only what's published to the host. See docs/release/docker.md.
services:
  backend:
    build:
      context: ../backend
    environment:
      # Boot/infra tunables (listen address, on-disk paths, logging, worker
      # counts) live in the mounted config.docker.yaml, not here — this block
      # is only what genuinely needs a per-deployment override. Every secret
      # (session/CSRF signing, Telegram token encryption, MCP JWT signing,
      # the Telegram webhook secret_token) is auto-provisioned into the file-
      # backed credential store on first boot (internal/credentials.Provision)
      # and persisted under the /data volume below — there is nothing to set
      # here for them anymore. LLM provider keys and the default provider/
      # model are likewise configured after first boot, from the Settings UI
      # (or its first-run setup wizard) — never here.
      XCHATS_CONFIG: "/config.yaml"
      # internal/credentials' file-backed fallback (Keyring has no OS session
      # to run in inside a container) and internal/settings' JSON store both
      # live under the persistent /data volume already mounted below, not
      # the container's own (ephemeral, throwaway-on-recreate) $HOME.
      XCHATS_ALLOW_FILE_CREDENTIALS: "1"
      XCHATS_DATA_DIR: "/data/appdata"
      XCHATS_CONFIG_DIR: "/data/appconfig"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:${FRONTEND_PORT:-8081}}"
      # --- MCP connector (plan/mcp.md) ---
      # API_BASE_URL is the fallback public origin for deployments that do not
      # use embedded ngrok. A saved ngrok authtoken plus API key discovers and
      # persists the account's assigned domain; xchats then uses that HTTPS
      # origin for every MCP/OAuth issuer, audience, discovery, and callback.
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${BACKEND_PORT:-8080}}"
      # FRONTEND_BASE_URL is where the KB Manager widget's "Review and publish
      # in Xchats" link lands — the frontend service below, as reachable from
      # the operator's own browser (a host-published port, never "frontend:80").
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:${FRONTEND_PORT:-8081}}"
      # --- Telegram (Bot API) — not secrets, so still a per-deployment
      # override here rather than a Settings UI field. Empty => polling mode
      # (see config.yaml's telegram.mode comment). ---
      TG_WEBHOOK_PUBLIC_BASE_URL: "${TG_WEBHOOK_PUBLIC_BASE_URL:-}"
      TG_API_BASE_URL: "${TG_API_BASE_URL:-}"
      # Simulator HTTP API (Phase 10) — gates whether the route is registered
      # at all. Default false; set true to test without a WhatsApp number.
      SIMULATOR_ENABLED: "${SIMULATOR_ENABLED:-false}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.docker.yaml:/config.yaml:ro
      - blobdata:/data/blob
      - sqlitedata:/data

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  blobdata:
  sqlitedata:
