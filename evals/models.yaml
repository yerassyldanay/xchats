# evals/models.yaml — the model list every scenario runs against, in one place.
# Add a model here and every scenario picks it up on its next render+run.
#
# Pricing is HAND-MAINTAINED and produces an ESTIMATE, not real spend — OpenRouter prices
# change, and promptfoo has no pricing table of its own for generic `openrouter:` IDs (see
# README.md "Known limits"). Leave input_per_mtok/output_per_mtok unset (omit them) for a
# model whose current price you haven't verified — the report will call it out as
# "unknown_pricing" instead of showing a number that might be wrong. Check current prices at
# pricing_source before filling one in, and update pricing_checked_at when you do.
#
# Four more optional per-provider fields exist (harness/types.go: ModelProvider) but are
# deliberately left unset below except where noted, for the same "mark unverified rather
# than guess" reason as pricing:
#   - label: disambiguates two entries that share one `id` but differ in config (e.g. a
#     reasoning-on/reasoning-off comparison pair — see evals/models-reasoning.yaml for a
#     worked example). Every entry below is the only one of its id, so none need it.
#   - provider: {order: [...], allow_fallbacks: true|false} pins the exact OpenRouter
#     upstream route for a comparison run, e.g.:
#       provider:
#         order: ["Google AI Studio"]   # verify the exact upstream name against
#         allow_fallbacks: false        # OpenRouter's own model page before using this —
#                                        # it is NOT verified for any entry below.
#   - reasoning: {enabled, effort, max_tokens, exclude, billed_separately} opts a model
#     into OpenRouter's reasoning API — see evals/models-reasoning.yaml.
#   - default: true marks a provider as part of the no-flag baseline. Omitting -models on
#     `run`/`render` now resolves to just the default:true providers below (deepseek-v3.2-exp,
#     gemini-2.5-flash — changed 2026-07-24 from the original gpt-4o-mini/gemini-2.5-flash-lite
#     pair to match the pair actually used for the shop-kb-v1 comparison runs), not every
#     provider in this file — added after a mixed fast/slow, cheap/expensive batch got
#     launched by accident with no explicit -models.
#     Pass `-models all` to explicitly run every provider in this file (the old behavior).
pricing_source: "https://openrouter.ai/models"
pricing_checked_at: "2026-07-11"
providers:
  - id: openrouter:openai/gpt-4o-mini
    temperature: 0.3
    max_tokens: 500
    # Stable, well-documented OpenAI list price — unchanged for a long time as of
    # pricing_checked_at. Still: verify at pricing_source before trusting it for a real
    # budget decision, per the file-level note above.
    input_per_mtok: 0.15
    output_per_mtok: 0.60
  - id: openrouter:anthropic/claude-haiku-4.5
    temperature: 0.3
    max_tokens: 500
    # Verified against pricing_source on pricing_checked_at.
    input_per_mtok: 1.00
    output_per_mtok: 5.00
  - id: openrouter:google/gemini-2.5-flash
    temperature: 0.3
    max_tokens: 500
    # Verified against pricing_source on pricing_checked_at.
    input_per_mtok: 0.30
    output_per_mtok: 2.50
    default: true
  - id: openrouter:google/gemini-2.5-flash-lite
    temperature: 0.3
    max_tokens: 500
    # Verified directly against the OpenRouter API on 2026-07-10 (see
    # evals/parsing-costs.md) — cheaper than gemini-2.5-flash and a candidate vision
    # model for the extraction eval; compare its extraction quality, not just its price.
    input_per_mtok: 0.10
    output_per_mtok: 0.40
  # --- Comparison candidates added 2026-07-18, verified directly against each model's
  # own openrouter.ai page on that date (not yet re-checked at any later pricing_checked_at
  # date above — re-verify before trusting these for a real budget decision). Both are
  # meaningfully pricier than the "basic" four above; see the cost note in the run that
  # added them before launching a big repeats/screening pass.
  - id: openrouter:google/gemini-3.5-flash
    temperature: 0.3
    # A same-day partial run (2026-07-18) at max_tokens=500 showed 38/38 sampled calls
    # truncated (finish_reason=length) at ~496 avg completion tokens — the model was
    # cut off before finishing its JSON reply on essentially every call. Raised to 1500
    # to give real headroom; re-check truncation on the next run before trusting a low
    # contract-pass rate as a quality signal rather than a budget artifact.
    max_tokens: 1500
    # Verified against openrouter.ai/google/gemini-3.5-flash on 2026-07-18.
    input_per_mtok: 1.50
    output_per_mtok: 9.00
    # Added 2026-07-23 (plan linear-noodling-quail): run 2026-07-22_23-37-42-94b6 showed
    # 31/31 responses carrying in-band "Thinking: ..." narration in message.content —
    # the exact failure mode minimax-m2.5's verified enabled+exclude config fixed.
    # NOT yet probe-verified for THIS model (no billed calls were approved for this
    # change; this file's own doctrine says verify before trusting) — run the ~$0.02
    # curl probe from the plan before the next real run, and fall back to
    # {enabled: false} (the kimi-k2.5 precedent, see git history) if exclude
    # misbehaves. The harness's final-answer extraction now recovers combined
    # reasoning+JSON output regardless, so this is an optimization, not the safety net.
    reasoning:
      enabled: true
      exclude: true
  # --- Kimi models removed 2026-07-23 (both moonshotai/kimi-k2.6 and
  # moonshotai/kimi-k2.5): expensive relative to the remaining candidates and no
  # longer evaluation candidates. kimi-k2.6 additionally truncated 31/31 responses
  # mid-reasoning at finish_reason=length in run 2026-07-22_23-37-42-94b6 (slowest
  # model in the file at ~63s avg). Historical run artifacts containing Kimi
  # responses are kept unchanged under evals/runs/ — raw results stay available for
  # investigation; only the FUTURE active roster changed here.
  # --- Non-thinking comparison candidate added 2026-07-18, verified directly against its
  # own openrouter.ai page on that date. A cheaper, faster-turnaround sibling of a
  # thinking-mode model (deepseek-r1) rather than a variant of the two above — max_tokens
  # starts at 500 to match the "basic" models since it isn't reasoning-native; re-check for
  # truncation on the first real run, same as gemini-3.5-flash/kimi-k2.6 above, before
  # trusting a low contract-pass rate as quality signal rather than a budget artifact.
  - id: openrouter:deepseek/deepseek-v3.2-exp
    temperature: 0.3
    max_tokens: 500
    # Verified against openrouter.ai/deepseek/deepseek-v3.2-exp on 2026-07-18. Reasoning is
    # toggleable via `reasoning_enabled` but left unset/off here (ReasoningConfig nil) —
    # this entry is explicitly the non-thinking comparison point.
    input_per_mtok: 0.27
    output_per_mtok: 0.41
    default: true
  # --- Qwen replaced 2026-07-18: qwen/qwen3.7-plus and qwen/qwen3.7-max were removed after
  # real measured data showed them by far the slowest models in this file (29.5s and 22.0s
  # avg latency vs ~1-10s for everything else), driven by averaging 1150-1560 completion
  # tokens per reply despite neither being thinking-branded; qwen/qwen3-max (the
  # non-thinking sibling added alongside deepseek-v3.2-exp) was removed at the same time
  # rather than kept half-orphaned. Replaced with two Chinese-provider alternatives neither
  # yet run in this harness — re-check both for truncation/latency on the first real run,
  # same caveat as every other un-run entry in this file.
  - id: openrouter:minimax/minimax-m2.5
    temperature: 0.3
    # A 2026-07-18 diagnostic run at max_tokens=500 showed 11/29
    # calls truncated (finish_reason=length), completion tokens capping out at 500 on
    # every one of them — the model consistently narrates a multi-paragraph "Thinking: ..."
    # rule-by-rule analysis in-band before the JSON answer (not via OpenRouter's separate
    # reasoning channel), so 500 wasn't enough room to reach the answer at all on over a
    # third of calls. Raised to 2000. NOTE: this does not fix the separate problem that
    # even a non-truncated reply still fails parseModelJSON — the "Thinking:" prose isn't
    # fenced, so the whole raw string (prose + trailing JSON) isn't itself valid JSON. See
    # retained evaluation notes for examples of both failure modes.
    max_tokens: 2000
    # Verified against openrouter.ai/minimax/minimax-m2.5 on 2026-07-18 — non-thinking,
    # 205K context.
    input_per_mtok: 0.15
    output_per_mtok: 0.90
    # Confirmed 2026-07-19 via a direct curl to OpenRouter's API (not promptfoo) that
    # enabled+exclude actually routes the in-band "Thinking: ..." narration out of the
    # visible content: with this config, message.content came back as PURE JSON, no prose
    # attached, while usage.completion_tokens_details.reasoning_tokens (87) confirmed the
    # model still reasoned internally and was billed for it — just not returned inline
    # anymore. billed_separately: false because that same response's cost_details showed
    # reasoning folded into the one upstream_inference_completions_cost bucket, same as
    # gemini-2.5-flash's pair in models-reasoning.yaml — re-verify if this ever looks off.
    reasoning:
      enabled: true
      exclude: true
      billed_separately: false
  # (moonshotai/kimi-k2.5 removed 2026-07-23 together with kimi-k2.6 — see the note
  # above. Its probe history — reasoning.max_tokens unenforced; reasoning.enabled:
  # false was the reliable fix — remains in git history and in the snapshots of the
  # runs that used it.)

# archived_models refuses the listed ids for NEW runs (see types.go ArchivedModel) —
# filterProviders excludes them from every selection path, including "-models all", and
# errors loudly if one is named explicitly. Historical run artifacts referencing these
# ids are never touched; the harness/HTML UI badges those rows as archived by looking
# this stanza up at DISPLAY time, not by mutating the stored run.
archived_models:
  - id: openrouter:moonshotai/kimi-k2.5
    reason: "removed 2026-07-23 — expensive relative to remaining candidates, no longer an evaluation candidate"
  - id: openrouter:moonshotai/kimi-k2.6
    reason: "removed 2026-07-23 — 31/31 responses truncated mid-reasoning at finish_reason=length, slowest model in the file"
  - id: openrouter:google/gemini-3.5-flash
    reason: "reasoning.enabled+exclude config added 2026-07-23 is NOT yet probe-verified for this model — entry stays for its config notes but is refused for new spend until verified"
