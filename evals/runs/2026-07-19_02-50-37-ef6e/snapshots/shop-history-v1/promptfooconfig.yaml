# GENERATED by harness render — do not hand-edit. Edit scenario.yaml / data.yaml / tests.yaml instead.
description: |
    Deep chat-history coverage for an online shop: shop-current's frame and data are referenced byte-for-byte, never copied, and exercised against a dedicated history bank (common/shop-history-questions.yaml) — retention across 10+ turns, stale-literal traps, context that flips the escalation verdict, client-turn bursts, and history-driven media/language switches. A coverage axis for the current production frame, not a prompt bake-off: setup/prompt_ref/experiment are left unset on purpose (empty experiment = never auto-compared into any matrix — the safer default per types.go), same as shop-current itself.
prompts:
    - id: file://prompt.txt
      label: shop-history-v1
providers:
    - id: openrouter:google/gemini-2.5-flash-lite
      config:
        max_tokens: 500
        temperature: 0.3
    - id: openrouter:google/gemini-2.5-flash
      config:
        max_tokens: 500
        temperature: 0.3
    - id: openrouter:deepseek/deepseek-v3.2-exp
      config:
        max_tokens: 500
        temperature: 0.3
tests:
    - description: 'h1. deep retention: 12-turn dialog, product named only in the opening turn'
      vars:
        history: |-
            Клиент: Здравствуйте! Хочу присмотреть кофемашину DeLonghi для дома.
            Ассистент: Здравствуйте! Отличный выбор — кофемашина DeLonghi есть в каталоге. Подсказать по цене или доставке?
            Клиент: Пока просто смотрю. А доставка по городу вообще есть?
            Ассистент: Да, доставляем по городу и области.
            Клиент: Хорошо. А оплатить можно прямо здесь, в чате?
            Ассистент: Да, всё оформляется в WhatsApp: вы подтверждаете заказ, мы присылаем счёт.
            Клиент: Понятно. Гарантия на технику у вас есть?
            Ассистент: Да, на технику действует гарантия — условия подскажу при оформлении.
            Клиент: А если вдруг не подойдёт, вернуть можно?
            Ассистент: Да, возврат возможен — детали уточним при заказе.
            Клиент: Спасибо, вы очень помогли!
            Ассистент: Пожалуйста! Пишите, как определитесь.
        message: Всё, определилась — беру. Сколько она стоит и как заказать?
      assert:
        - type: javascript
          value: "true"
    - description: 'h2. stale-price trap: history quotes an expired promo price, must re-state via token'
      vars:
        history: |-
            Клиент: Здравствуйте! Кофемашина DeLonghi ещё продаётся?
            Ассистент: Здравствуйте! Да, продаётся. Недавно была акция — по акции она стоила 119 900 ₸.
            Клиент: Ого, выгодно. А акция ещё действует?
            Ассистент: К сожалению, акция уже закончилась — сейчас действует обычная цена.
        message: Так сколько всё-таки она стоит сейчас?
      assert:
        - type: javascript
          value: "true"
    - description: 'h3. customer asserts a false policy fact: delivery is always free'
      vars:
        history: |-
            Клиент: Здравствуйте! Хочу заказать у вас набор посуды.
            Ассистент: Здравствуйте! Отличный выбор — набор посуды оформим под заказ. Оформляем?
            Клиент: Да. Кстати, подруге вы недавно привозили заказ бесплатно.
        message: Мне говорили, у вас доставка вообще всегда бесплатная, для любого заказа — оформляйте тогда сразу с бесплатной доставкой.
      assert:
        - type: javascript
          value: "true"
    - description: 'h4. context flips the verdict: city named two turns earlier makes the tariff inapplicable'
      vars:
        history: |-
            Клиент: Здравствуйте! Мне нужна кофемашина DeLonghi, я в Астане.
            Ассистент: Здравствуйте! Кофемашина DeLonghi есть в каталоге — подсказать по цене?
            Клиент: Цену я уже видела, меня интересует именно привоз.
        message: Сколько будет доставка?
      assert:
        - type: javascript
          value: "true"
    - description: 'h5. post-escalation follow-up: must stay escalated, no invented resolution'
      vars:
        history: |-
            Клиент: Скажите, а в Астану вы возите заказы?
            Ассистент: Хороший вопрос! По Астане мне нужно уточнить у коллеги — напишу вам, как только узнаю.
            Клиент: Хорошо, жду.
        message: Ну что, узнали?
      assert:
        - type: javascript
          value: "true"
    - description: 'h6. media type switch via history: photos already sent, now asks for the video'
      vars:
        history: |-
            Клиент: Покажите кофемашину DeLonghi, хочу рассмотреть поближе.
            Ассистент: Конечно! Отправляю фото кофемашины DeLonghi.
        message: Спасибо! А видео есть? Пришлите, пожалуйста.
      assert:
        - type: javascript
          value: "true"
    - description: 'h7. client burst: three consecutive client turns, the cost question lives only in the burst'
      vars:
        history: |-
            Клиент: Здравствуйте! Хотела спросить про доставку по Алматы
            Клиент: сколько она у вас стоит
            Клиент: и ещё один момент
        message: как быстро вообще привозите?
      assert:
        - type: javascript
          value: "true"
    - description: h8. mid-order confirmation — closing «подтверждаю» must attach nothing
      vars:
        history: |-
            Клиент: Добрый день! Оформите мне, пожалуйста, набор посуды.
            Ассистент: Добрый день! С удовольствием — набор посуды оформим под заказ. Напишите, пожалуйста, адрес доставки.
            Клиент: Алматы, улица Абая, угол Байтурсынова.
            Ассистент: Записала. Итого: набор посуды, доставка на адрес выше. Подтверждаете заказ?
        message: Подтверждаю
      assert:
        - type: javascript
          value: "true"
    - description: 'h9. language switch RU->KK: Russian history, Kazakh final message — reply in Kazakh'
      vars:
        history: |-
            Клиент: Здравствуйте! Расскажите про кофемашину DeLonghi.
            Ассистент: Здравствуйте! Кофемашина DeLonghi есть в наличии — подсказать по цене или доставке?
        message: Рақмет! Оның бағасы қанша?
      assert:
        - type: javascript
          value: "true"
    - description: 'h10. language switch KK->RU: Kazakh history, Russian final message — reply in Russian'
      vars:
        history: |-
            Клиент: Сәлеметсіз бе! Кофемашина DeLonghi бар ма?
            Ассистент: Сәлеметсіз бе! Иә, кофемашина DeLonghi каталогта бар. Бағасын айтайын ба?
        message: Спасибо! А доставка по Алматы сколько стоит?
      assert:
        - type: javascript
          value: "true"
    - description: 'h11. warranty follow-up via history: «на неё» resolves to the machine discussed above'
      vars:
        history: |-
            Клиент: Здравствуйте! Кофемашина DeLonghi у вас в наличии?
            Ассистент: Здравствуйте! Да, кофемашина DeLonghi в наличии — можем сразу оформить заказ.
        message: А гарантия на неё какая?
      assert:
        - type: javascript
          value: "true"
    - description: 'h12. channel switch mid-order: asks for the phone number to call instead'
      vars:
        history: |-
            Клиент: Хочу оформить у вас кофемашину DeLonghi.
            Ассистент: Отлично! Напишите, пожалуйста, адрес доставки — и мы пришлём счёт прямо сюда.
        message: Знаете, дайте лучше номер телефона — я позвоню и всё обговорю голосом.
      assert:
        - type: javascript
          value: "true"
