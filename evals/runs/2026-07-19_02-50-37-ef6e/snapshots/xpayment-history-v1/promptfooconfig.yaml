description: |
    Deep chat-history coverage for a software/SaaS product: xpayment-decisions-v1's frame and data are referenced byte-for-byte and exercised against a dedicated history bank (common/xpayment-history-questions.yaml) — tariff retention, plan switching with pronoun resolution, stale-price traps, onboarding, unsupported-integration escalation, and document follow-ups. A coverage axis for the current production frame, not a prompt bake-off: setup/prompt_ref/experiment are left unset on purpose, same as xpayment-decisions-v1 itself.
prompts:
    - id: file://prompt.txt
      label: xpayment-history-v1
providers:
    - id: openrouter:google/gemini-2.5-flash-lite
      config:
        max_tokens: 500
        temperature: 0.3
    - id: openrouter:google/gemini-2.5-flash
      config:
        max_tokens: 500
        temperature: 0.3
    - id: openrouter:deepseek/deepseek-v3.2-exp
      config:
        max_tokens: 500
        temperature: 0.3
tests:
    - description: 'xph1. deep tariff retention: 10-turn dialog, Standard named only near the opening'
      vars:
        history: |-
            Клиент: Здравствуйте! Хочу подключить приём платежей, думаю на счёт тарифа Стандарт.
            Ассистент: Здравствуйте! Отличный выбор — «Стандарт» подойдёт для растущего бизнеса. Подсказать по условиям?
            Клиент: Да, а подключение быстро проходит?
            Ассистент: Да, подключение быстрое — нужен только БИН компании.
            Клиент: Хорошо. А если возникнут вопросы после подключения, куда обращаться?
            Ассистент: Поддержка на связи в рабочие часы — пишите прямо сюда.
            Клиент: Отлично. А если объём вырастет, можно перейти на другой тариф?
            Ассистент: Да, перейти на другой тариф можно в любой момент.
            Клиент: Хорошо, буду иметь в виду.
            Ассистент: Пишите, если понадобится помощь с выбором.
        message: А комиссия у него какая?
      assert:
        - type: javascript
          value: "true"
    - description: xph2. tariff switch mid-thread, pronoun resolves to the LATER tariff
      vars:
        history: |-
            Клиент: Здравствуйте! Какой тариф лучше для начала — у нас только открылась точка.
            Ассистент: Для старта отлично подойдёт «Старт» — тариф для ИП и небольших магазинов.
            Клиент: Понятно. А через полгода, если вырастем?
            Ассистент: Тогда есть смысл посмотреть на «Бизнес» — там максимум объёма и приоритетная поддержка.
            Клиент: Хорошо, будем иметь в виду. А поддержка у вас работает без выходных?
            Ассистент: Поддержка на связи в рабочие часы — для срочных вопросов пишите прямо сюда.
        message: Кстати, а какой у него лимит платежей в месяц?
      assert:
        - type: javascript
          value: "true"
    - description: xph3. stale subscription-price trap
      vars:
        history: |-
            Клиент: Сколько раньше стоил тариф Стандарт?
            Ассистент: Раньше «Стандарт» стоил 14 900 ₸ в месяц, но с тех пор цены обновились.
        message: А сейчас сколько он стоит?
      assert:
        - type: javascript
          value: "true"
    - description: xph4. customer asserts a false commission claim
      vars:
        history: |-
            Клиент: Хочу подключить тариф Стандарт.
            Ассистент: Отлично! «Стандарт» подключим — оптимален для растущего бизнеса.
        message: Кстати, коллега говорил, что у Стандарта вообще нет комиссии — так что подключайте без неё.
      assert:
        - type: javascript
          value: "true"
    - description: xph5. unsupported software integration, after a realistic tariff thread
      vars:
        history: |-
            Клиент: Хочу подключить тариф Бизнес для интернет-магазина.
            Ассистент: Отлично! «Бизнес» — максимум объёма и приоритетная поддержка.
        message: А у вас есть готовая интеграция с 1С или вебхуки для заказов?
      assert:
        - type: javascript
          value: "true"
    - description: xph6. onboarding-duration follow-up, after settling on Business
      vars:
        history: |-
            Клиент: Буду подключать тариф Бизнес.
            Ассистент: Отлично! «Бизнес» — подойдёт для вашего объёма.
        message: А сколько по времени занимает подключение?
      assert:
        - type: javascript
          value: "true"
    - description: 'xph7. software-document switch: pricing card already sent, now the Business contract'
      vars:
        history: |-
            Клиент: Пришлите, пожалуйста, тарифную карточку — хочу сравнить все варианты.
            Ассистент: Конечно! Отправляю карточку тарифов.
        message: Спасибо! А можно ещё договор и презентацию по тарифу Бизнес?
      assert:
        - type: javascript
          value: "true"
    - description: 'xph8. post-escalation follow-up: crypto question stays unresolved'
      vars:
        history: |-
            Клиент: А вы принимаете оплату криптовалютой?
            Ассистент: Хороший вопрос! Мне нужно уточнить у коллеги — напишу, как только узнаю.
        message: Ну как, узнали про крипту?
      assert:
        - type: javascript
          value: "true"
    - description: 'xph9. language switch RU->KK: Russian tariff history, Kazakh final question'
      vars:
        history: |-
            Клиент: Здравствуйте! Расскажите про тариф Бизнес.
            Ассистент: Здравствуйте! «Бизнес» — максимум объёма и приоритетная поддержка.
        message: Рақмет! Ал оның айлық төлем лимиті қандай?
      assert:
        - type: javascript
          value: "true"
    - description: xph10. conversation close after tariff comparison — no plan card pushed
      vars:
        history: |-
            Клиент: Здравствуйте! Расскажите про тарифы, выбираю между Стандарт и Бизнес.
            Ассистент: Конечно! «Стандарт» подойдёт для растущего бизнеса, «Бизнес» — максимум объёма и приоритетная поддержка. Подсказать цены?
            Клиент: Да, было бы неплохо.
            Ассистент: «Стандарт» стоит 19 900 ₸ в месяц, «Бизнес» — 49 900 ₸ в месяц.
            Клиент: Спасибо, мне нужно подумать.
        message: Пока достаточно информации, я подумаю и напишу позже.
      assert:
        - type: javascript
          value: "true"
