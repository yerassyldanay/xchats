# Phase 2.3 combo canary set, KK branch — the union of the Phase 2.1 language canary set
# and the Phase 2.2 escalation-trap canary set, hand-split by detectLang routing (this
# file: every message detectLang routes "kk" — the pure-Kazakh questions, the Kazakh
# escalation canary, and the genuinely-mixed message whose QUESTION clause is Kazakh).
# Same source IDs as common/shop-questions.yaml 2, 3, 20, 21 — kept in sync by hand, same
# caveat as lang-canary-v1/tests.yaml; canary_sync_test.go enforces both the ID list and
# field-identity with the bank.
tests:
  - id: "2. price question, Kazakh"
    message: "Кофемашина DeLonghi қанша тұрады?"
    requires:
      - ["product.coffee-machine.price"]
    escalate: false
    language: kk

  - id: "3. delivery cost + time, Kazakh"
    message: "Жеткізу қанша тұрады және қанша күнде жетеді?"
    requires:
      - ["policy.main.delivery_cost"]
      - ["policy.main.delivery_time", "policy.main.delivery_in_days"]
    escalate: false
    language: kk

  - id: "20. mixed Kazakh/Russian message — reply in the dominant language (the question itself is Kazakh)"
    message: "Сәлеметсіз бе! Скажите, пожалуйста, кофемашина DeLonghi қанша тұрады?"
    requires:
      - ["product.coffee-machine.price"]
    escalate: false
    language: kk

  - id: "21. off-KB city coverage, Kazakh — escalation must stay Kazakh with no invented claim"
    message: "Сіздер Астанаға жеткізесіздер ме?"
    escalate: true
    language: kk
    must_not_contain:
      - "жеткізбейміз"
      - "аймағымыздан тыс"
