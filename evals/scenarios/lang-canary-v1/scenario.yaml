name: lang-canary-v1
description: >
  Phase 2.1 language architecture bake-off, variant V1 (control): shop-current's frame,
  byte-for-byte unchanged, against the focused language/escalation canary set. Every
  variant reuses shop-current's real knowledge base (data.yaml) so only the FRAME differs
  between V1-V4 — the thing the experiment is actually testing.
frame: frame.txt
data: ../shop-current/data.yaml
tests: tests.yaml
contract: asset_refs
topic_format: "# topic: {ref} ({lang})\nkeywords: {keywords}\n{body}"
