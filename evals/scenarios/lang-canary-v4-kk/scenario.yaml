name: lang-canary-v4-kk
description: >
  Phase 2.1 language architecture bake-off, variant V4 (language-routed frame) — the KK
  branch: a full Kazakh translation of the frame, sent only when detectLang (langdetect.go)
  classifies the customer's message as Kazakh. KB/FACTS injected data stays Russian (no
  knowledge-base duplication, per the plan's explicit constraint) — this frame tests
  whether the MODEL can read a Russian KB and answer in Kazakh when its entire active
  instruction set is unambiguously Kazakh, with zero competing Russian instructions.
  DRAFT translation — NOT yet reviewed by a native Kazakh speaker; the plan requires that
  review before this variant is used in any billed comparison (a mistranslated instruction
  would invalidate the whole experiment).
frame: frame.txt
data: ../shop-current/data.yaml
tests: tests.yaml
contract: asset_refs
topic_format: "# topic: {ref} ({lang})\nkeywords: {keywords}\n{body}"
