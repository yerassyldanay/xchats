# V4's KK branch — exactly the tests detectLang (langdetect.go) would route to the KK
# frame: the pure-Kazakh questions, the Kazakh escalation canary, and the genuinely-mixed
# message (test 20 — its QUESTION clause is Kazakh, so the dominant-language rule routes
# it here; it lived in the RU sibling under the old blanket mixed→Russian rule). Same
# source IDs as lang-canary-v1/tests.yaml's tests 2, 3, 20, 21 — kept in sync by hand,
# same caveat.
tests:
  - id: "2. price question, Kazakh"
    message: "Кофемашина DeLonghi қанша тұрады?"
    requires:
      - ["product.coffee-machine.price"]
    escalate: false
    language: kk

  - id: "3. delivery cost + time, Kazakh"
    message: "Жеткізу қанша тұрады және қанша күнде жетеді?"
    requires:
      - ["policy.main.delivery_cost"]
      - ["policy.main.delivery_time", "policy.main.delivery_in_days"]
    escalate: false
    language: kk

  - id: "20. mixed Kazakh/Russian message — reply in the dominant language (the question itself is Kazakh)"
    message: "Сәлеметсіз бе! Скажите, пожалуйста, кофемашина DeLonghi қанша тұрады?"
    requires:
      - ["product.coffee-machine.price"]
    escalate: false
    language: kk

  - id: "21. off-KB city coverage, Kazakh — escalation must stay Kazakh with no invented claim"
    message: "Сіздер Астанаға жеткізесіздер ме?"
    escalate: true
    language: kk
    must_not_contain:
      - "жеткізбейміз"
      - "аймағымыздан тыс"
