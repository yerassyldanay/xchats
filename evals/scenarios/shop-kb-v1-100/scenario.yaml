name: shop-kb-v1-100
description: >
  Catalog-size sweep (2026-07 consolidation), size 100 — the schema-driven Russian shop
  family (pipeline: schema_kb_v1), the full 100-product pool (no `limits`). Shares the
  exact same frame, model roster, and common question banks as shop-kb-v1-10/-50 —
  product COUNT is the only thing this scenario varies, so a cross-size comparison
  isolates the effect of catalog size from every other variable. Prompt v5 (2026-08:
  adds the ТАРИФЫ block, which v4 had no slot for at all — every ai_tariffs row was
  invisible to the model, so a priced tariff escalated as unknown; carries v4's whole
  rule body otherwise, incl. 2026-07-27's admission-first escalation holding replies,
  the bidirectional escalate/text consistency rule, and Kazakh recognized by words and
  grammar via lingua-go rather than by alphabet — see ../shop-kb-v1/frame-ru.txt,
  common/kb-messages-kk-ambiguous.yaml, and evals/SHOP_KB_V1_30_POSTMORTEM.md).
pipeline: schema_kb_v1
