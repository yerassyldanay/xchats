# Deliberately IDENTICAL across shop-kb-v1-10/-50/-100 (byte-for-byte, no per-size
# probe appended) — the catalog-size sweep controls for every variable except product
# count, so the question set itself must never differ between sizes. See each
# scenario.yaml's description and evals/SHOP_KB_V1_30_POSTMORTEM.md. kb-messages-kk.yaml
# and kb-messages-kk-ambiguous.yaml are a separate axis (Kazakh customer input against
# the same Russian prompt/KB, DRAFT pending native review — see each file's own header
# comment), included identically too: the -kk bank is native Kazakh orthography, the
# -kk-ambiguous bank is Kazakh typed without any Kazakh-specific letters.
include:
  - common/kb-questions-ru.yaml
  - common/kb-history-ru.yaml
  - common/kb-delivery-ru.yaml
  - common/kb-messages-kk.yaml
  - common/kb-messages-kk-ambiguous.yaml
