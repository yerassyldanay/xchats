include:
  - common/kb-questions-ru.yaml
  - common/kb-delivery-ru.yaml

tests:
  - id: "17. deep-list product (#100 of 100), out-of-stock honesty"
    message: "Сэндвичница Samsung есть в наличии?"
    # Archived scenario — this test was already broken by the v2 name-only design
    # (an out-of-stock product renders no facts at all, so `requires` here never
    # resolved). requires/must_contain_any removed for consistency with the 2026-07-26
    # in_stock removal (see kb-questions-ru.yaml test 3); never re-run for real.
    escalate: false
    language: ru

  - id: "18. deep-list product (#96 of 100), photo and certificate combined (all_of)"
    message: "Пришлите, пожалуйста, фото сэндвичницы Xiaomi и сертификат качества."
    media:
      all_of: ["products.sandwich-maker-xiaomi.gallery_images", "products.sandwich-maker-xiaomi.certificate_documents"]
    escalate: false
    language: ru
