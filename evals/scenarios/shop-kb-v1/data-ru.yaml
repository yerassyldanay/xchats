      body_md: В каталоге бытовая техника для дома и кухни — от кофемашин и мелкой техники до пылесосов и обогревателей. Актуальные позиции, цены и наличие — только из FACTS и каталога, не перечисляй товары по памяти.
      featured_image: ""
      illustration_images: []
      explainer_videos: []
