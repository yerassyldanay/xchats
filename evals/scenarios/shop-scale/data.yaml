# evals/scenarios/shop-scale/data.yaml — ONE shared 30-product pool for the shop-scale-10 /
# shop-scale-20 / shop-scale-30 scenarios. Each of those scenario.yaml files points AT this
# file and applies a `limits: { product: N }` cap (see types.go/render.go's applyLimits) —
# there is no separate data.yaml per size, so the three sizes can never drift apart except
# by row count. Same fact_tables schema as shop-decisions-v1 (language-neutral values,
# grouped media) so frame.txt is a straight copy of that scenario's.
#
# Rows 1-10 are referenced by common/shop-scale-questions.yaml (shared across all three
# sizes — anything there must exist at every size). Rows 11-20 are only referenced by
# shop-scale-20/tests.yaml and shop-scale-30/tests.yaml's own deep-list tests. Rows 21-30
# are only referenced by shop-scale-30/tests.yaml.

topics:
  - ref: delivery
    title: "Доставка"
    keywords: "доставка, сроки, привезти"
    body: |
      Доставляем по городу и области; при крупном заказе доставка бесплатна.
      Точные суммы и сроки называй только из FACTS.
    media:
      - field: illustration_images
        files: ["delivery-zones.png"]
        description: "карта зон доставки"

  - ref: payment
    title: "Оплата"
    keywords: "оплата, kaspi, рассрочка"
    body: |
      Принимаем карту, Kaspi и наличные; на крупные заказы есть рассрочка.

  - ref: installments
    title: "Рассрочка"
    keywords: "рассрочка, кредит, частями"
    body: |
      Рассрочка доступна на заказы от порога бесплатной доставки; оформляется на кассе Kaspi.

  - ref: how_to_order
    title: "Как заказать"
    keywords: "заказ, оформить, купить"
    body: |
      Напишите, что интересует → адрес доставки → подтверждение. Счёт пришлём в WhatsApp.

  - ref: warranty
    title: "Гарантия"
    keywords: "гарантия, поломка, ремонт"
    body: |
      На технику действует гарантия производителя; срок называй только из FACTS.

  - ref: returns
    title: "Возврат"
    keywords: "возврат, вернуть, не подошло"
    body: |
      Возврат возможен, если товар не был в использовании; срок называй только из FACTS.

  - ref: promo
    title: "Акции"
    keywords: "акция, скидка, промокод"
    body: |
      Актуальные акции уточняйте у менеджера — здесь фиксированного списка нет.
    # Deliberately no FACTS-backed value: this topic exists so a model has somewhere
    # honest to escalate a promo question to, instead of inventing a discount percentage.

  - ref: pickup
    title: "Самовывоз"
    keywords: "самовывоз, забрать, склад"
    body: |
      Самовывоз возможен со склада в Алматы по предварительной записи.

  - ref: support
    title: "Поддержка"
    keywords: "поддержка, помощь, вопрос"
    body: |
      Поддержка на связи в рабочие часы; контакты — из FACTS.

  - ref: catalog_overview
    title: "Каталог"
    keywords: "каталог, ассортимент, что есть"
    body: |
      В каталоге техника для дома и кухни — кофемашины, мелкая бытовая техника, посуда.
      Полный список и цены — только из FACTS, не перечисляй товары по памяти.

