server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Media uploads (POST /xchats/api/v1/media) — nginx defaults to 1m, which
    # 413s real photos/videos. WhatsApp media tops out ~16m; allow headroom for
    # documents. The Go upload handler streams these fine.
    client_max_body_size 64m;

    # API + webhook + SSE → backend. Same-origin, so cookies and EventSource work.
    location /xchats/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # SSE: stream, don't buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Eval comparison UI's static data — a read-only alias into evals/runs/ (bind-
    # mounted only from docker-compose.override.yaml; the base compose file never
    # mounts /evals-runs, so on a deploy built from base alone this location plainly
    # 404s — see that override file's own comment for why that split is deliberate).
    # Unauthenticated: fine for the local dev stack (raw model replies, prompts, KB
    # material), not for an internet-facing deploy of this same image.
    location /evals-data/ {
        alias /evals-runs/;
        # The harness rewrites runs.json, catalogs, manifests, and reports in
        # place. Without an explicit policy browsers may heuristically cache
        # these static responses, leaving an older tab on a stale export.
        add_header Cache-Control "no-store" always;
        types {
            application/json  json;
            text/html         html;
            text/plain        md txt diff;
            image/jpeg        jpg jpeg;
            image/png         png;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # The SPA shell points at content-hashed JS/CSS assets. Revalidate the tiny
    # shell itself so a rebuilt image is picked up on the next page load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Public, crawlable blog — prerendered static HTML, zero client JS (see
    # frontend/scripts/build-blog.ts). No SPA fallback here: a mistyped article
    # URL must 404 for real, not silently serve the internal app shell (which
    # would then bounce an anonymous crawler to /login — a soft-404 search
    # engines penalise). robots.txt/sitemap.xml live at the dist root and are
    # already reachable through location / below.
    #
    # error_page here serves build-blog.ts's styled 404.html while preserving
    # the real 404 status (nginx's error_page does not rewrite the status
    # unless given an explicit =NNN) — so it reads as a real page to a human
    # but still tells search engines "not found", not "here's content".
    # ru and en have real content and their own styled 404; kk doesn't ship
    # any page yet (see readAllArticles' locale gating), so it gets nginx's
    # bare 404 rather than a styled page with nothing behind it — add its own
    # location block here, mirroring /en/blog/ below, once kk.md exists.
    location /blog/ {
        try_files $uri $uri/ =404;
        error_page 404 /blog/404.html;
    }
    location /en/blog/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/blog/404.html;
    }
    location ~ ^/kk/blog/ {
        try_files $uri $uri/ =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
