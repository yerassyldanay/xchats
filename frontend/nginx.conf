server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers — `always` so they land on error responses
    # too (nginx otherwise drops add_header on non-2xx/3xx by default),
    # matching the Cache-Control directives already used below. CSP is
    # same-origin throughout because the whole app is: the API, SSE stream,
    # and webhook all proxy through /xchats/ on this same nginx (see that
    # location block), so nothing here needs to reach another origin.
    # style-src allows 'unsafe-inline' for Vue's scoped/dynamic style
    # bindings; everything else stays same-origin-only.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Media uploads (POST /xchats/api/v1/media) — nginx defaults to 1m, which
    # 413s real photos/videos. WhatsApp media tops out ~16m; allow headroom for
    # documents. The Go upload handler streams these fine.
    client_max_body_size 64m;

    # API + webhook + SSE → backend. Same-origin, so cookies and EventSource work.
    location /xchats/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream "http://backend:8080";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # SSE: stream, don't buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Telegram's webhook (POST /telegram/api/v1/webhook/:account_id) and the
    # three Meta channels' public routes (GET|POST /meta/api/v1/webhook/*,
    # GET /meta/api/v1/oauth/*/callback, GET /meta/api/v1/media/:media_id) —
    # every one of them public, unauthenticated, and called by an outside
    # party (Telegram's/Meta's own servers, or a browser mid-OAuth-redirect),
    # never by the SPA itself, so they get their own locations rather than
    # living under /xchats/. Without these an operator-fronted nginx (see
    # deploy/docker-compose.yaml) leaves both entirely unreachable — it has
    # only ever worked when the embedded tunnel serves the backend router
    # directly (tunnel.Deps.Handler = router), bypassing this file altogether.
    location /telegram/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream "http://backend:8080";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
    location /meta/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream "http://backend:8080";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # Eval comparison UI's static data — a read-only alias into evals/runs/ (bind-
    # mounted only from docker-compose.override.yaml; the base compose file never
    # mounts /evals-runs, so on a deploy built from base alone this location plainly
    # 404s — see that override file's own comment for why that split is deliberate).
    # Unauthenticated: fine for the local dev stack (raw model replies, prompts, KB
    # material), not for an internet-facing deploy of this same image.
    location /evals-data/ {
        alias /evals-runs/;
        # The harness rewrites runs.json, catalogs, manifests, and reports in
        # place. Without an explicit policy browsers may heuristically cache
        # these static responses, leaving an older tab on a stale export.
        add_header Cache-Control "no-store" always;
        types {
            application/json  json;
            text/html         html;
            text/plain        md txt diff;
            image/jpeg        jpg jpeg;
            image/png         png;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # The SPA shell points at content-hashed JS/CSS assets. Revalidate the tiny
    # shell itself so a rebuilt image is picked up on the next page load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Public, crawlable blog — prerendered static HTML, zero client JS (see
    # frontend/scripts/build-blog.ts). No SPA fallback here: a mistyped article
    # URL must 404 for real, not silently serve the internal app shell (which
    # would then bounce an anonymous crawler to /login — a soft-404 search
    # engines penalise). robots.txt/sitemap.xml live at the dist root and are
    # already reachable through location / below.
    #
    # error_page here serves build-blog.ts's styled 404.html while preserving
    # the real 404 status (nginx's error_page does not rewrite the status
    # unless given an explicit =NNN) — so it reads as a real page to a human
    # but still tells search engines "not found", not "here's content".
    # ru and en have real content and their own styled 404; kk doesn't ship
    # any page yet (see readAllArticles' locale gating), so it gets nginx's
    # bare 404 rather than a styled page with nothing behind it — add its own
    # location block here, mirroring /en/blog/ below, once kk.md exists.
    location /blog/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
        error_page 404 /blog/404.html;
    }
    location /en/blog/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
        error_page 404 /en/blog/404.html;
    }
    location ~ ^/kk/blog/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
